<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burn Counter Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        
        .burn-counter-container {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }

        .burn-counter-card {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), rgba(234, 88, 12, 0.05));
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            min-width: 320px;
            box-shadow: 0 8px 32px rgba(249, 115, 22, 0.15);
            transition: all 0.3s ease;
        }

        .burn-counter-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            gap: 0.75rem;
        }

        .flame-emoji {
            font-size: 2rem;
            animation: flame-flicker 2s infinite alternate;
            filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.6));
        }

        .burn-counter-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .burn-counter-stats {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .burn-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(249, 115, 22, 0.2);
        }

        .burn-stat:last-child {
            border-bottom: none;
        }

        .burn-stat.highlight {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.15), rgba(234, 88, 12, 0.1));
            border-radius: 8px;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #ccc;
            font-weight: 500;
        }

        .stat-value {
            font-size: 0.9rem;
            color: white;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .embers-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .ember {
            position: absolute;
            font-size: 1rem;
            opacity: 0.7;
            animation: ember-float 4s infinite linear;
        }

        .ember-1 { top: 20%; left: 15%; animation-delay: 0s; }
        .ember-2 { top: 30%; right: 20%; animation-delay: 1s; }
        .ember-3 { bottom: 25%; left: 25%; animation-delay: 2s; }
        .ember-4 { top: 60%; right: 15%; animation-delay: 3s; }
        .ember-5 { bottom: 40%; right: 35%; animation-delay: 1.5s; }

        @keyframes flame-flicker {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.6));
            }
            25% {
                transform: scale(1.1) rotate(2deg);
                filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.8));
            }
            50% {
                transform: scale(0.95) rotate(-1deg);
                filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.4));
            }
            75% {
                transform: scale(1.05) rotate(1deg);
                filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.7));
            }
        }

        @keyframes ember-float {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.7;
            }
            25% {
                transform: translateY(-10px) translateX(5px) rotate(90deg);
                opacity: 0.9;
            }
            50% {
                transform: translateY(-20px) translateX(-5px) rotate(180deg);
                opacity: 0.5;
            }
            75% {
                transform: translateY(-15px) translateX(3px) rotate(270deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(0) translateX(0) rotate(360deg);
                opacity: 0.7;
            }
        }

        .test-button {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Burn Counter Test</h1>
    
    <button class="test-button" onclick="testBurnCounter()">Test Burn Counter Update</button>
    <button class="test-button" onclick="testFlameAnimation()">Test Flame Animation</button>
    
    <!-- Token Burn Counter -->
    <div class="burn-counter-container mt-8">
        <div class="burn-counter-card">
            <div class="burn-counter-header">
                <div class="flame-emoji">🔥</div>
                <h3 class="burn-counter-title">$UPLIFT Burn Counter</h3>
            </div>
            <div class="burn-counter-stats">
                <div class="burn-stat">
                    <span class="stat-label">Initial Supply:</span>
                    <span class="stat-value">1,000,000,000</span>
                </div>
                <div class="burn-stat">
                    <span class="stat-label">Current Supply:</span>
                    <span class="stat-value" id="current-supply">970,000,000</span>
                </div>
                <div class="burn-stat highlight">
                    <span class="stat-label">Tokens Burned:</span>
                    <span class="stat-value" id="burned-amount">30,000,000</span>
                </div>
            </div>
            <div class="embers-container">
                <div class="ember ember-1">✨</div>
                <div class="ember ember-2">✨</div>
                <div class="ember ember-3">✨</div>
                <div class="ember ember-4">✨</div>
                <div class="ember ember-5">✨</div>
            </div>
        </div>
    </div>

    <script>
        // Test burn counter functionality
        function testBurnCounter() {
            console.log('Testing burn counter update...');
            
            // Simulate API call
            const initialSupply = 1000000000;
            const currentSupply = 970000000; // Updated fallback supply to show 3% burned
            const burned = initialSupply - currentSupply;
            const burnPercentage = (burned / initialSupply) * 100;
            
            // Update display
            const currentSupplyElement = document.getElementById('current-supply');
            const burnedAmountElement = document.getElementById('burned-amount');
            
            if (currentSupplyElement) {
                currentSupplyElement.textContent = currentSupply.toLocaleString(undefined, {maximumFractionDigits: 9});
            }
            
            if (burnedAmountElement) {
                burnedAmountElement.textContent = burned.toLocaleString(undefined, {maximumFractionDigits: 9});
            }
            
            // Add burn percentage
            const highlightStat = document.querySelector('.burn-stat.highlight');
            if (highlightStat) {
                const existingPercentage = highlightStat.parentNode.querySelector('.burn-stat:not(.highlight)');
                if (!existingPercentage || !existingPercentage.textContent.includes('Burn Rate')) {
                    const percentageDiv = document.createElement('div');
                    percentageDiv.className = 'burn-stat';
                    percentageDiv.innerHTML = `
                        <span class="stat-label">Burn Rate:</span>
                        <span class="stat-value">${burnPercentage.toFixed(4)}%</span>
                    `;
                    highlightStat.parentNode.insertBefore(percentageDiv, highlightStat.nextSibling);
                }
            }
            
            console.log('Burn counter updated successfully!');
        }
        
        function testFlameAnimation() {
            console.log('Testing flame animation...');
            const flameElement = document.querySelector('.flame-emoji');
            if (flameElement) {
                flameElement.style.animation = 'flame-flicker 1s infinite alternate';
                setTimeout(() => {
                    flameElement.style.animation = 'flame-flicker 2s infinite alternate';
                }, 2000);
            }
            console.log('Flame animation tested!');
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Burn counter test page loaded successfully!');
        });
    </script>
</body>
</html>
