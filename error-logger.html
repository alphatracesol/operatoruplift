<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Logger - Phase 1 Testing</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .log-section { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 5px; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
        .info { color: #60a5fa; }
        .success { color: #4ade80; }
        .critical { color: #ef4444; font-weight: bold; }
        button { padding: 10px 20px; margin: 5px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2563eb; }
        #errorLog { margin-top: 20px; max-height: 800px; overflow-y: auto; background: #0f0f0f; padding: 15px; border-radius: 5px; }
        .log-entry { margin: 5px 0; padding: 8px; border-radius: 3px; font-family: monospace; font-size: 12px; }
        .log-error { background: #2d1b1b; border-left: 4px solid #f87171; }
        .log-warning { background: #2d2b1b; border-left: 4px solid #fbbf24; }
        .log-info { background: #1b2d2d; border-left: 4px solid #60a5fa; }
        .log-success { background: #1b2d1b; border-left: 4px solid #4ade80; }
        .log-critical { background: #2d1b1b; border-left: 4px solid #ef4444; }
        .timestamp { color: #888; }
        .error-type { font-weight: bold; }
        .error-message { margin-top: 5px; }
        .error-stack { margin-top: 5px; color: #aaa; font-size: 11px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-card { background: #2a2a2a; padding: 15px; border-radius: 5px; text-align: center; }
        .stat-number { font-size: 2rem; font-weight: bold; }
        .stat-label { color: #888; margin-top: 5px; }
        iframe { width: 100%; height: 400px; border: 1px solid #333; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔍 Error Logger - Phase 1 Testing</h1>
    
    <div class="log-section">
        <h2>Controls</h2>
        <button onclick="startErrorLogging()">Start Error Logging</button>
        <button onclick="stopErrorLogging()">Stop Error Logging</button>
        <button onclick="clearLog()">Clear Log</button>
        <button onclick="exportLog()">Export Log</button>
        <button onclick="openAppInNewTab()">Open App in New Tab</button>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="errorCount">0</div>
            <div class="stat-label">Errors</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="warningCount">0</div>
            <div class="stat-label">Warnings</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="criticalCount">0</div>
            <div class="stat-label">Critical</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">Total</div>
        </div>
    </div>

    <div class="log-section">
        <h2>Live App Preview</h2>
        <iframe id="appFrame" src="app.html"></iframe>
    </div>

    <div class="log-section">
        <h2>Error Log</h2>
        <div id="errorLog"></div>
    </div>

    <script>
        let errorLog = [];
        let isLogging = false;
        let originalConsoleError, originalConsoleWarn, originalConsoleLog;
        let errorCount = 0, warningCount = 0, criticalCount = 0, totalCount = 0;

        function logError(type, message, details = null, stack = null) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = {
                type,
                message,
                details,
                stack,
                timestamp
            };
            
            errorLog.push(logEntry);
            
            // Update counters
            if (type === 'error') errorCount++;
            else if (type === 'warning') warningCount++;
            else if (type === 'critical') criticalCount++;
            totalCount++;
            
            updateStats();
            displayLogEntry(logEntry);
        }

        function displayLogEntry(entry) {
            const logContainer = document.getElementById('errorLog');
            const logDiv = document.createElement('div');
            logDiv.className = `log-entry log-${entry.type}`;
            
            let html = `
                <div class="timestamp">[${entry.timestamp}]</div>
                <div class="error-type">${entry.type.toUpperCase()}</div>
                <div class="error-message">${entry.message}</div>
            `;
            
            if (entry.details) {
                html += `<div class="error-details">${entry.details}</div>`;
            }
            
            if (entry.stack) {
                html += `<div class="error-stack">${entry.stack}</div>`;
            }
            
            logDiv.innerHTML = html;
            logContainer.appendChild(logDiv);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateStats() {
            document.getElementById('errorCount').textContent = errorCount;
            document.getElementById('warningCount').textContent = warningCount;
            document.getElementById('criticalCount').textContent = criticalCount;
            document.getElementById('totalCount').textContent = totalCount;
        }

        function startErrorLogging() {
            if (isLogging) return;
            
            isLogging = true;
            logError('info', 'Error logging started');
            
            const iframe = document.getElementById('appFrame');
            const iframeWindow = iframe.contentWindow;
            
            try {
                // Override console methods
                originalConsoleError = iframeWindow.console.error;
                originalConsoleWarn = iframeWindow.console.warn;
                originalConsoleLog = iframeWindow.console.log;
                
                iframeWindow.console.error = function(...args) {
                    const message = args.join(' ');
                    logError('error', message, null, new Error().stack);
                    originalConsoleError.apply(iframeWindow.console, args);
                };
                
                iframeWindow.console.warn = function(...args) {
                    const message = args.join(' ');
                    logError('warning', message);
                    originalConsoleWarn.apply(iframeWindow.console, args);
                };
                
                iframeWindow.console.log = function(...args) {
                    const message = args.join(' ');
                    if (message.includes('error') || message.includes('Error') || message.includes('ERROR')) {
                        logError('error', message);
                    } else if (message.includes('warning') || message.includes('Warning') || message.includes('WARNING')) {
                        logError('warning', message);
                    } else {
                        logError('info', message);
                    }
                    originalConsoleLog.apply(iframeWindow.console, args);
                };
                
                // Override window.onerror
                iframeWindow.onerror = function(message, source, lineno, colno, error) {
                    logError('critical', `JavaScript Error: ${message}`, 
                        `Source: ${source}, Line: ${lineno}, Column: ${colno}`, 
                        error ? error.stack : null);
                    return false;
                };
                
                // Override window.onunhandledrejection
                iframeWindow.onunhandledrejection = function(event) {
                    logError('critical', `Unhandled Promise Rejection: ${event.reason}`, 
                        null, event.reason ? event.reason.stack : null);
                };
                
                // Monitor network errors
                if (iframeWindow.performance) {
                    const observer = new iframeWindow.PerformanceObserver((list) => {
                        list.getEntries().forEach((entry) => {
                            if (entry.entryType === 'resource' && entry.transferSize === 0 && entry.duration > 0) {
                                logError('error', `Failed network request: ${entry.name}`, 
                                    `Duration: ${entry.duration}ms, Size: ${entry.transferSize} bytes`);
                            }
                        });
                    });
                    observer.observe({ entryTypes: ['resource'] });
                }
                
                logError('success', 'Error logging system initialized successfully');
                
            } catch (error) {
                logError('critical', 'Failed to initialize error logging', error.message, error.stack);
            }
        }

        function stopErrorLogging() {
            if (!isLogging) return;
            
            isLogging = false;
            logError('info', 'Error logging stopped');
            
            const iframe = document.getElementById('appFrame');
            const iframeWindow = iframe.contentWindow;
            
            try {
                // Restore original console methods
                if (originalConsoleError) {
                    iframeWindow.console.error = originalConsoleError;
                }
                if (originalConsoleWarn) {
                    iframeWindow.console.warn = originalConsoleWarn;
                }
                if (originalConsoleLog) {
                    iframeWindow.console.log = originalConsoleLog;
                }
                
                logError('success', 'Error logging system stopped');
                
            } catch (error) {
                logError('critical', 'Failed to stop error logging', error.message, error.stack);
            }
        }

        function clearLog() {
            errorLog = [];
            errorCount = 0;
            warningCount = 0;
            criticalCount = 0;
            totalCount = 0;
            updateStats();
            document.getElementById('errorLog').innerHTML = '';
            logError('info', 'Error log cleared');
        }

        function exportLog() {
            const logData = {
                timestamp: new Date().toISOString(),
                summary: {
                    errors: errorCount,
                    warnings: warningCount,
                    critical: criticalCount,
                    total: totalCount
                },
                entries: errorLog
            };
            
            const blob = new Blob([JSON.stringify(logData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `error-log-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            logError('success', 'Error log exported');
        }

        function openAppInNewTab() {
            window.open('app.html', '_blank');
            logError('info', 'Opened app.html in new tab');
        }

        // Auto-start error logging when page loads
        window.addEventListener('load', () => {
            logError('info', 'Error Logger page loaded');
            setTimeout(() => {
                startErrorLogging();
            }, 2000);
        });

        // Monitor iframe load
        document.getElementById('appFrame').addEventListener('load', () => {
            logError('info', 'App iframe loaded');
        });
    </script>
</body>
</html>
