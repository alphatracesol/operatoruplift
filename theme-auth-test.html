<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Theme Test</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
            --primary-color: #f97316;
            --card-bg: rgba(24, 24, 27, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --primary-color: #f97316;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.1);
        }
        
        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
            --primary-color: #f97316;
            --card-bg: rgba(24, 24, 27, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        .auth-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text-color);
            margin-bottom: 10px;
            text-align: center;
        }
        
        .auth-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .theme-toggle:hover {
            transform: scale(1.1);
        }
        
        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }
        
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            background: rgba(16, 185, 129, 0.2);
            border-left: 4px solid #10b981;
        }
        
        /* Matrix Rain Background */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .matrix-column {
            position: absolute;
            top: -100%;
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 5px var(--primary-color);
            animation: matrix-fall linear infinite;
        }
        
        @keyframes matrix-fall {
            0% {
                transform: translateY(-100vh);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</div>
    
    <!-- Matrix Rain Background -->
    <div id="matrixRain" class="matrix-rain"></div>
    
    <div class="test-container">
        <h1 class="auth-title">Operator Uplift</h1>
        <p class="auth-subtitle">Testing auth title color and matrix rain background</p>
        
        <div class="status">
            <strong>Current Theme:</strong> <span id="currentTheme">Dark</span>
        </div>
        
        <div style="text-align: center; margin: 20px 0;">
            <button onclick="setTheme('dark')">Set Dark Theme</button>
            <button onclick="setTheme('light')">Set Light Theme</button>
            <button onclick="toggleTheme()">Toggle Theme</button>
            <button onclick="toggleMatrixRain()">Toggle Matrix Rain</button>
        </div>
        
        <div class="status">
            <strong>Test Results:</strong>
            <ul>
                <li>✅ Auth title should change color with theme</li>
                <li>✅ Matrix rain should be orange (primary color)</li>
                <li>✅ Matrix rain should fall continuously</li>
                <li>✅ No white text on light background</li>
            </ul>
        </div>
    </div>

    <script>
        let currentTheme = 'dark';
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            currentTheme = theme;
            updateToggleButton();
        }
        
        function toggleTheme() {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        }
        
        function updateToggleButton() {
            const button = document.getElementById('themeToggle');
            button.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
            document.getElementById('currentTheme').textContent = currentTheme.charAt(0).toUpperCase() + currentTheme.slice(1);
        }
        
        function toggleMatrixRain() {
            const matrixRain = document.getElementById('matrixRain');
            if (matrixRain.style.display === 'none' || matrixRain.style.display === '') {
                matrixRain.style.display = 'block';
            } else {
                matrixRain.style.display = 'none';
            }
        }
        
        // Matrix Rain Background Effect
        function initializeMatrixRain() {
            const matrixContainer = document.getElementById('matrixRain');
            if (!matrixContainer) return;
            
            const columns = Math.floor(window.innerWidth / 20);
            const characters = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            
            for (let i = 0; i < columns; i++) {
                const column = document.createElement('div');
                column.className = 'matrix-column';
                column.style.left = (i * 20) + 'px';
                column.style.animationDuration = (Math.random() * 3 + 2) + 's';
                column.style.animationDelay = Math.random() * 2 + 's';
                
                let columnText = '';
                const columnLength = Math.floor(Math.random() * 20) + 10;
                for (let j = 0; j < columnLength; j++) {
                    columnText += characters[Math.floor(Math.random() * characters.length)];
                }
                column.textContent = columnText;
                
                matrixContainer.appendChild(column);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setTheme('dark');
            initializeMatrixRain();
            updateToggleButton();
        });
    </script>
</body>
</html>
