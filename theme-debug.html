<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Debug</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e5e7eb;
        }
        
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #1f2937;
        }
        
        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --text-color: #e5e7eb;
        }
        
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .debug-info {
            background: rgba(0,0,0,0.1);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Theme Debug</h1>
    
    <div class="debug-info">
        <h3>Current Values:</h3>
        <p>Data Theme: <span id="dataTheme">none</span></p>
        <p>CSS Variable --bg-color: <span id="cssBgColor">loading...</span></p>
        <p>Computed Background: <span id="computedBg">loading...</span></p>
        <p>Theme Manager: <span id="themeManager">loading...</span></p>
    </div>
    
    <button onclick="setTheme('dark')">Set Dark</button>
    <button onclick="setTheme('light')">Set Light</button>
    <button onclick="toggleTheme()">Toggle</button>
    <button onclick="updateDebug()">Update Debug Info</button>
    
    <script>
        let currentTheme = 'dark';
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            currentTheme = theme;
            updateDebug();
        }
        
        function toggleTheme() {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        }
        
        function updateDebug() {
            const dataTheme = document.documentElement.getAttribute('data-theme');
            const computedStyle = getComputedStyle(document.documentElement);
            const cssBgColor = computedStyle.getPropertyValue('--bg-color');
            const bodyComputedBg = getComputedStyle(document.body).backgroundColor;
            
            document.getElementById('dataTheme').textContent = dataTheme || 'none';
            document.getElementById('cssBgColor').textContent = cssBgColor;
            document.getElementById('computedBg').textContent = bodyComputedBg;
            document.getElementById('themeManager').textContent = typeof window.ThemeManager !== 'undefined' ? 'Available' : 'Not Available';
            
            console.log('Theme Debug:', {
                dataTheme,
                cssBgColor,
                bodyComputedBg,
                currentTheme
            });
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setTheme('dark');
            updateDebug();
        });
    </script>
</body>
</html>
