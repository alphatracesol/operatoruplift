<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Test - Operator Uplift</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #2d5a2d; border: 1px solid #4caf50; }
        .error { background: #5a2d2d; border: 1px solid #f44336; }
        .info { background: #2d4a5a; border: 1px solid #2196f3; }
        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #45a049; }
        .loading { background: #ff9800; }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #444;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>🧪 Operator Uplift App Test</h1>
    
    <div class="test-section">
        <h2>📋 Test Controls</h2>
        <button onclick="testAppFunctions()">Test Core Functions</button>
        <button onclick="testAuthSystem()">Test Auth System</button>
        <button onclick="testThemeSystem()">Test Theme System</button>
        <button onclick="loadAppInFrame()">Load App in Frame</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div class="test-section">
        <h2>📊 Test Results</h2>
        <div id="testResults"></div>
    </div>

    <div class="test-section">
        <h2>🌐 App Preview</h2>
        <iframe id="appFrame" src="app.html" title="Operator Uplift App"></iframe>
    </div>

    <script>
        let testCount = 0;
        let passCount = 0;
        let failCount = 0;

        function addTestResult(message, type = 'info') {
            const resultsDiv = document.getElementById('testResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.innerHTML = `<strong>${type.toUpperCase()}:</strong> ${message}`;
            resultsDiv.appendChild(resultDiv);
            
            if (type === 'success') passCount++;
            else if (type === 'error') failCount++;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function updateTestSummary() {
            addTestResult(`Tests completed: ${testCount} | Passed: ${passCount} | Failed: ${failCount}`, 'info');
        }

        function testAppFunctions() {
            addTestResult('Starting core function tests...', 'info');
            
            // Test if app.html loads without errors
            try {
                const iframe = document.getElementById('appFrame');
                iframe.onload = function() {
                    try {
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        addTestResult('App HTML loaded successfully', 'success');
                        
                        // Test if key functions exist
                        const iframeWindow = iframe.contentWindow;
                        if (iframeWindow.OperatorUplift) {
                            addTestResult('OperatorUplift object exists', 'success');
                        } else {
                            addTestResult('OperatorUplift object missing', 'error');
                        }
                        
                        if (iframeWindow.FunctionRegistry) {
                            addTestResult('FunctionRegistry exists', 'success');
                        } else {
                            addTestResult('FunctionRegistry missing', 'error');
                        }
                        
                        if (iframeWindow.ThemeManager) {
                            addTestResult('ThemeManager exists', 'success');
                        } else {
                            addTestResult('ThemeManager missing', 'error');
                        }
                        
                    } catch (error) {
                        addTestResult(`Error accessing iframe content: ${error.message}`, 'error');
                    }
                };
                
                // Reload the iframe to trigger the test
                iframe.src = iframe.src;
                
            } catch (error) {
                addTestResult(`Error testing app functions: ${error.message}`, 'error');
            }
        }

        function testAuthSystem() {
            addTestResult('Testing authentication system...', 'info');
            
            try {
                const iframe = document.getElementById('appFrame');
                const iframeWindow = iframe.contentWindow;
                
                if (iframeWindow.setupAuthEventListeners) {
                    addTestResult('setupAuthEventListeners function exists', 'success');
                } else {
                    addTestResult('setupAuthEventListeners function missing', 'error');
                }
                
                if (iframeWindow.initializeUserData) {
                    addTestResult('initializeUserData function exists', 'success');
                } else {
                    addTestResult('initializeUserData function missing', 'error');
                }
                
            } catch (error) {
                addTestResult(`Error testing auth system: ${error.message}`, 'error');
            }
        }

        function testThemeSystem() {
            addTestResult('Testing theme system...', 'info');
            
            try {
                const iframe = document.getElementById('appFrame');
                const iframeWindow = iframe.contentWindow;
                
                if (iframeWindow.ThemeManager && iframeWindow.ThemeManager.toggleTheme) {
                    addTestResult('ThemeManager.toggleTheme exists', 'success');
                } else {
                    addTestResult('ThemeManager.toggleTheme missing', 'error');
                }
                
                if (iframeWindow.ThemeManager && iframeWindow.ThemeManager.getCurrentTheme) {
                    addTestResult('ThemeManager.getCurrentTheme exists', 'success');
                } else {
                    addTestResult('ThemeManager.getCurrentTheme missing', 'error');
                }
                
            } catch (error) {
                addTestResult(`Error testing theme system: ${error.message}`, 'error');
            }
        }

        function loadAppInFrame() {
            addTestResult('Loading app in iframe...', 'info');
            const iframe = document.getElementById('appFrame');
            iframe.src = 'app.html';
        }

        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
            testCount = 0;
            passCount = 0;
            failCount = 0;
        }

        // Auto-run tests when page loads
        window.addEventListener('load', function() {
            setTimeout(() => {
                addTestResult('Page loaded, ready for testing', 'info');
            }, 1000);
        });
    </script>
</body>
</html>
