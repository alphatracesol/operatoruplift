<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 1 Comprehensive Test Runner - Operator Uplift</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #111827, #0a0a0a);
            color: #e5e7eb;
            margin: 0;
            padding: 2rem;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            background: rgba(24, 24, 27, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(12px);
        }
        .test-result {
            padding: 0.5rem;
            border-radius: 0.25rem;
            margin: 0.5rem 0;
        }
        .test-result.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }
        .test-result.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        .test-result.warning {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            color: #f59e0b;
        }
        .test-result.info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }
        .btn {
            background: #f97316;
            color: black;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem;
        }
        .btn:hover {
            background: #fb923c;
        }
        .btn:disabled {
            background: #52525b;
            cursor: not-allowed;
        }
        #console-output {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f97316, #fb923c);
            transition: width 0.3s ease;
            width: 0%;
        }
        .summary {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            border-radius: 0.5rem;
            padding: 1rem;
            margin: 1rem 0;
        }
        .iframe-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        .iframe-container iframe {
            width: 100%;
            height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Phase 1 Comprehensive Test Runner</h1>
        <p>Testing all Phase 1 functionality and identifying errors for fixing</p>
        
        <div class="test-section">
            <h2>📋 Test Controls</h2>
            <button class="btn" onclick="runAllTests()">Run All Tests</button>
            <button class="btn" onclick="runPhase1Tests()">Run Phase 1 Tests</button>
            <button class="btn" onclick="testAppLoading()">Test App Loading</button>
            <button class="btn" onclick="testPersonalityIntegration()">Test Personality Integration</button>
            <button class="btn" onclick="testAIChatInterface()">Test AI Chat Interface</button>
            <button class="btn" onclick="clearConsole()">Clear Console</button>
            </div>
            
            <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
            </div>
            
        <div class="test-section">
            <h2>📊 Test Results</h2>
            <div id="test-results"></div>
        </div>

        <div class="test-section">
            <h2>📝 Console Output</h2>
            <div id="console-output"></div>
        </div>

        <div class="iframe-container">
            <div>
                <h3>App Fixed Version</h3>
                <iframe id="app-frame" src="app-fixed.html"></iframe>
            </div>
            <div>
                <h3>AI Chat Interface</h3>
                <iframe id="ai-frame" src="ai-chat-interface.html"></iframe>
            </div>
        </div>
    </div>

    <script>
        // Capture console output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        const consoleOutput = document.getElementById('console-output');
        
        function addToConsole(type, ...args) {
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            consoleOutput.textContent += `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog.apply(console, args);
            addToConsole('log', ...args);
        };
        
        console.error = (...args) => {
            originalError.apply(console, args);
            addToConsole('error', ...args);
        };
        
        console.warn = (...args) => {
            originalWarn.apply(console, args);
            addToConsole('warn', ...args);
        };
        
        function addTestResult(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            resultsDiv.appendChild(resultDiv);
        }
        
        function updateProgress(percent) {
            document.getElementById('progress-fill').style.width = percent + '%';
        }
        
        function clearConsole() {
            consoleOutput.textContent = '';
        }
        
        async function testAppLoading() {
            addTestResult('Testing app loading...', 'info');
            updateProgress(10);
            
            try {
                // Test app-fixed.html
                const appResponse = await fetch('app-fixed.html');
                if (appResponse.ok) {
                    addTestResult('✅ app-fixed.html loads successfully', 'success');
                } else {
                    addTestResult(`❌ app-fixed.html failed to load: ${appResponse.status}`, 'error');
                }
                
                // Test ai-chat-interface.html
                const aiResponse = await fetch('ai-chat-interface.html');
                if (aiResponse.ok) {
                    addTestResult('✅ ai-chat-interface.html loads successfully', 'success');
                } else {
                    addTestResult(`❌ ai-chat-interface.html failed to load: ${aiResponse.status}`, 'error');
                }
                
                // Test personality integration module
                const personalityResponse = await fetch('js/modules/personality-integration.js');
                if (personalityResponse.ok) {
                    addTestResult('✅ personality-integration.js loads successfully', 'success');
                } else {
                    addTestResult(`❌ personality-integration.js failed to load: ${personalityResponse.status}`, 'error');
                }
                
                updateProgress(30);
                
                // Test iframe content loading
                setTimeout(() => {
                    const appFrame = document.getElementById('app-frame');
                    const aiFrame = document.getElementById('ai-frame');
                    
                    try {
                        if (appFrame.contentDocument) {
                            addTestResult('✅ app-fixed.html iframe loaded successfully', 'success');
                        } else {
                            addTestResult('⚠️ app-fixed.html iframe may have loading issues', 'warning');
                        }
                    } catch (e) {
                        addTestResult('⚠️ Cannot access app-fixed.html iframe content (CORS)', 'warning');
                    }
                    
                    try {
                        if (aiFrame.contentDocument) {
                            addTestResult('✅ ai-chat-interface.html iframe loaded successfully', 'success');
                        } else {
                            addTestResult('⚠️ ai-chat-interface.html iframe may have loading issues', 'warning');
                        }
                    } catch (e) {
                        addTestResult('⚠️ Cannot access ai-chat-interface.html iframe content (CORS)', 'warning');
                    }
                    
                    updateProgress(50);
                }, 2000);
                
            } catch (error) {
                addTestResult(`❌ App loading test failed: ${error.message}`, 'error');
            }
        }
        
        async function testPersonalityIntegration() {
            addTestResult('Testing personality integration...', 'info');
            updateProgress(60);
            
            try {
                // Test localStorage for personality data
                const testData = {
                    userProfile: { name: 'Test User', email: 'test@example.com' },
                    personalityData: { motivationStyle: 'achievement', communicationStyle: 'direct' },
                    onboardingStatus: { completed: true, personalityAssessment: true }
                };
                
                localStorage.setItem('testPersonalityData', JSON.stringify(testData));
                const retrieved = JSON.parse(localStorage.getItem('testPersonalityData'));
                
                if (retrieved && retrieved.userProfile.name === 'Test User') {
                    addTestResult('✅ Personality data storage/retrieval works', 'success');
                } else {
                    addTestResult('❌ Personality data storage/retrieval failed', 'error');
                }
                
                // Clean up test data
                localStorage.removeItem('testPersonalityData');
                
                updateProgress(80);
                
                // Test personality integration module loading
                const script = document.createElement('script');
                script.src = 'js/modules/personality-integration.js';
                script.onload = () => {
                    addTestResult('✅ Personality integration module loaded successfully', 'success');
                    if (window.PersonalityIntegrationModule) {
                        addTestResult('✅ PersonalityIntegrationModule class available', 'success');
                    } else {
                        addTestResult('❌ PersonalityIntegrationModule class not found', 'error');
                    }
                };
                script.onerror = () => {
                    addTestResult('❌ Failed to load personality integration module', 'error');
                };
                document.head.appendChild(script);
                
            } catch (error) {
                addTestResult(`❌ Personality integration test failed: ${error.message}`, 'error');
            }
        }
        
        async function testAIChatInterface() {
            addTestResult('Testing AI chat interface...', 'info');
            updateProgress(90);
            
            try {
                // Test AI chat interface functionality
                const aiFrame = document.getElementById('ai-frame');
                
                setTimeout(() => {
                    try {
                        const frameDoc = aiFrame.contentDocument || aiFrame.contentWindow.document;
                        const chatContainer = frameDoc.querySelector('.chat-container');
                        const messageInput = frameDoc.querySelector('.message-input');
                        const sendButton = frameDoc.querySelector('.send-button');
                        
                        if (chatContainer) {
                            addTestResult('✅ AI chat container found', 'success');
                        } else {
                            addTestResult('❌ AI chat container not found', 'error');
                        }
                        
                        if (messageInput) {
                            addTestResult('✅ AI chat message input found', 'success');
                        } else {
                            addTestResult('❌ AI chat message input not found', 'error');
                        }
                        
                        if (sendButton) {
                            addTestResult('✅ AI chat send button found', 'success');
                        } else {
                            addTestResult('❌ AI chat send button not found', 'error');
                        }
                        
                    } catch (e) {
                        addTestResult('⚠️ Cannot access AI chat interface content (CORS)', 'warning');
                    }
                    
                    updateProgress(100);
                }, 3000);
                
            } catch (error) {
                addTestResult(`❌ AI chat interface test failed: ${error.message}`, 'error');
            }
        }
        
        async function runPhase1Tests() {
            addTestResult('🚀 Starting Phase 1 comprehensive tests...', 'info');
            updateProgress(0);
            
            await testAppLoading();
            await testPersonalityIntegration();
            await testAIChatInterface();
            
            addTestResult('✅ Phase 1 tests completed', 'success');
            
            // Generate summary
            const results = document.querySelectorAll('.test-result');
            const successCount = document.querySelectorAll('.test-result.success').length;
            const errorCount = document.querySelectorAll('.test-result.error').length;
            const warningCount = document.querySelectorAll('.test-result.warning').length;
            
            const summary = document.createElement('div');
            summary.className = 'summary';
            summary.innerHTML = `
                <h3>📊 Test Summary</h3>
                <p>✅ Success: ${successCount}</p>
                <p>❌ Errors: ${errorCount}</p>
                <p>⚠️ Warnings: ${warningCount}</p>
                <p>📝 Total Tests: ${results.length}</p>
                <p><strong>Phase 1 Status: ${errorCount === 0 ? 'PASSED' : 'FAILED'}</strong></p>
            `;
            
            document.getElementById('test-results').appendChild(summary);
        }
        
        async function runAllTests() {
            addTestResult('🚀 Starting comprehensive test suite...', 'info');
            
            // Run all test categories
            await runPhase1Tests();
            
            // Additional tests can be added here
            addTestResult('✅ All tests completed', 'success');
        }
        
        // Auto-run tests on page load
        window.addEventListener('load', () => {
            addTestResult('Page loaded, ready for testing...', 'info');
            setTimeout(() => {
                runPhase1Tests();
            }, 1000);
        });
    </script>
</body>
</html>
