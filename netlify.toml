[build]
  publish = "build"
  functions = "netlify/functions"
  command = "npm run build:mixed"
  # Configure secrets scanning to ignore Firebase environment variables
  # These are expected to be injected into the build output for client-side use
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "FIREBASE_API_KEY,FIREBASE_AUTH_DOMAIN,FIREBASE_PROJECT_ID,FIREBASE_STORAGE_BUCKET,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_APP_ID,FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,CORS_ORIGIN,UPLIFT_MINT,SOLANA_CLUSTER,DAILY_REDEEM_POINTS_CAP,NEW_USER_REDEEM_POINTS_CAP,WEEKLY_REDEEM_POINTS_CAP,MONTHLY_ISSUANCE_UPLIFT_CAP,POINTS_RATE,POINT_USD,FALLBACK_UPLIFT_USD,REDEMPTION_MODE,REDEEM_COOLDOWN_HOURS,REDEEM_UPLIFT_PER_POINT,REDEMPTION_VESTING_DAYS,TIER_MULTIPLIERS,TRUST_TIERS,PRICE_ENDPOINT,PRICE_TTL_MS,REQUIRE_PROOF_OF_HUMAN,AUDIT_RATE_PERCENT,BLOCK_VPN_HIGH_RISK,SESSION_SECRET,HELIUS_API_KEY,HELIUS_RPC_URL,HELIUS_WEBSOCKET_URL,HELIUS_ADDRESS_TX_HISTORY,HELIUS_PARSE_TRANSACTIONS,HUGGINGFACE_API_KEY,HF_TOKEN,CLAUDE_API_KEY,GEMINI_API_KEY,OPENROUTER_API_KEY,PERPLEXITY_API_KEY,XAI_API_KEY"
    # Omit scanning on build artifacts and legacy backup/test pages to avoid false positives where numeric
    # env values appear in content for demos/tests.
    SECRETS_SCAN_OMIT_PATHS = "build/**,pages/**,backup*/**,last working deploy*/**,last working version*/**,last-working-version*/**,last working deploy - Copy/**,backup-*/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "ws", "redis", "express", "serverless-http", "cors", "body-parser", "@solana/web3.js", "@solana/spl-token", "tweetnacl", "bs58"]

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/uplift-token"
  to = "/uplift-token.html"
  status = 200

[[redirects]]
  from = "/uplift-token/"
  to = "/uplift-token.html"
  status = 200

# Authentication redirects for OAuth flows
[[redirects]]
  from = "/__/auth/handler"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/auth/callback"
  to = "/app.html"
  status = 200

# Firebase hosting compatibility
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://www.gstatic.com https://www.googletagmanager.com https://connect.facebook.net https://cdnjs.cloudflare.com https://www.gstatic.com/firebasejs/ https://fonts.googleapis.com https://unpkg.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.pexels.com https://placehold.co https://pbs.twimg.com https://cdn.jsdelivr.net https://www.facebook.com https://api.producthunt.com https://operatoruplift.com https://firebasestorage.googleapis.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://fcm.googleapis.com https://firebase.googleapis.com https://firebaseinstallations.googleapis.com https://firebasestorage.googleapis.com https://www.googletagmanager.com https://connect.facebook.net https://api.ipify.org https://api.operatoruplift.com wss://api.operatoruplift.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://www.gstatic.com https://cdnjs.cloudflare.com https://placehold.co https://pbs.twimg.com https://images.pexels.com https://www.google-analytics.com https://capig.madgicx.ai https://unpkg.com https://www.facebook.com https://apis.google.com https://api.mainnet-beta.solana.com https://public-api.solscan.io https://api.producthunt.com https://api-inference.huggingface.co https://api.deepseek.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.perplexity.ai https://api.x.ai https://price.jup.ag; frame-src 'self' https://operatorupliftmvp.firebaseapp.com https://accounts.google.com https://www.google.com https://cards.producthunt.com https://dexscreener.com https://www.dexscreener.com https://firebaseapp.com https://*.firebaseapp.com; media-src 'self' data: blob: https://operatoruplift.com; worker-src 'self' blob:"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "*.mp3"
  [headers.values]
    Content-Type = "audio/mpeg"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.wav"
  [headers.values]
    Content-Type = "audio/wav"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/firebase-config.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

# Scheduled functions
[[scheduled.functions]]
  name = "workers/redeem-fulfill"
  cron = "*/15 * * * *" # every 15 minutes

[[scheduled.functions]]
  name = "workers/weekly-reset"
  cron = "0 9 * * 1" # every Monday 09:00 UTC
