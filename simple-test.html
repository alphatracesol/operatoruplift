<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test - Operator Uplift</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #0f172a;
            color: #f8fafc;
        }
        .test-section {
            background: #1e293b;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        button {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #ea580c; }
        #console-output {
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔧 Operator Uplift - Simple Test</h1>
    
    <div class="test-section">
        <h2>📋 Basic Tests</h2>
        <button onclick="testBasicJS()">Test Basic JavaScript</button>
        <button onclick="testLocalStorage()">Test Local Storage</button>
        <button onclick="testConsole()">Test Console Output</button>
        <button onclick="testDOM()">Test DOM Manipulation</button>
    </div>

    <div class="test-section">
        <h2>🌐 Network Tests</h2>
        <button onclick="testCDN()">Test CDN Scripts</button>
        <button onclick="testFirebase()">Test Firebase CDN</button>
        <button onclick="testGoogleFonts()">Test Google Fonts</button>
    </div>

    <div class="test-section">
        <h2>📱 App Tests</h2>
        <button onclick="loadMainApp()">Load Main App</button>
        <button onclick="testAppStructure()">Test App Structure</button>
    </div>

    <div class="test-section">
        <h2>📊 Console Output</h2>
        <div id="console-output"></div>
        <button onclick="clearConsole()">Clear Console</button>
    </div>

    <div class="test-section">
        <h2>🔗 Quick Links</h2>
        <a href="/app.html" target="_blank"><button>Open Main App</button></a>
        <a href="/comprehensive-test-suite.html" target="_blank"><button>Open Test Suite</button></a>
        <a href="/index.html" target="_blank"><button>Open Index</button></a>
    </div>

    <script>
        // Override console.log to capture output
        const originalLog = console.log;
        const originalError = console.error;
        const consoleOutput = document.getElementById('console-output');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<span class="${type}">[${timestamp}] ${message}</span>`;
            consoleOutput.appendChild(logEntry);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            
            // Also log to actual console
            if (type === 'error') {
                originalError(message);
            } else {
                originalLog(message);
            }
        }

        console.log = (message) => log(message, 'info');
        console.error = (message) => log(message, 'error');

        // Test functions
        function testBasicJS() {
            log('🧪 Testing basic JavaScript...');
            try {
                const testArray = [1, 2, 3];
                const doubled = testArray.map(x => x * 2);
                log(`✅ Basic JS working: ${doubled.join(', ')}`);
            } catch (error) {
                log(`❌ Basic JS failed: ${error.message}`, 'error');
            }
        }

        function testLocalStorage() {
            log('🧪 Testing localStorage...');
            try {
                localStorage.setItem('test', 'working');
                const result = localStorage.getItem('test');
                localStorage.removeItem('test');
                log(`✅ localStorage working: ${result}`);
            } catch (error) {
                log(`❌ localStorage failed: ${error.message}`, 'error');
            }
        }

        function testConsole() {
            log('🧪 Testing console output...');
            log('✅ Console is working!');
        }

        function testDOM() {
            log('🧪 Testing DOM manipulation...');
            try {
                const testDiv = document.createElement('div');
                testDiv.textContent = 'DOM Test';
                document.body.appendChild(testDiv);
                document.body.removeChild(testDiv);
                log('✅ DOM manipulation working');
            } catch (error) {
                log(`❌ DOM manipulation failed: ${error.message}`, 'error');
            }
        }

        function testCDN() {
            log('🧪 Testing CDN scripts...');
            
            // Test Chart.js
            if (typeof Chart !== 'undefined') {
                log('✅ Chart.js loaded');
            } else {
                log('❌ Chart.js not loaded', 'error');
            }

            // Test GSAP
            if (typeof gsap !== 'undefined') {
                log('✅ GSAP loaded');
            } else {
                log('❌ GSAP not loaded', 'error');
            }

            // Test Tone.js
            if (typeof Tone !== 'undefined') {
                log('✅ Tone.js loaded');
            } else {
                log('❌ Tone.js not loaded', 'error');
            }

            // Test tsParticles
            if (typeof tsParticles !== 'undefined') {
                log('✅ tsParticles loaded');
            } else {
                log('❌ tsParticles not loaded', 'error');
            }
        }

        function testFirebase() {
            log('🧪 Testing Firebase CDN...');
            
            if (typeof firebase !== 'undefined') {
                log('✅ Firebase loaded');
                if (firebase.auth) {
                    log('✅ Firebase Auth loaded');
                } else {
                    log('❌ Firebase Auth not loaded', 'error');
                }
                if (firebase.firestore) {
                    log('✅ Firebase Firestore loaded');
                } else {
                    log('❌ Firebase Firestore not loaded', 'error');
                }
            } else {
                log('❌ Firebase not loaded', 'error');
            }
        }

        function testGoogleFonts() {
            log('🧪 Testing Google Fonts...');
            const interFont = document.querySelector('link[href*="Inter"]');
            if (interFont) {
                log('✅ Google Fonts link found');
            } else {
                log('❌ Google Fonts link not found', 'error');
            }
        }

        function loadMainApp() {
            log('🧪 Loading main app...');
            try {
                const iframe = document.createElement('iframe');
                iframe.src = '/app.html';
                iframe.style.width = '100%';
                iframe.style.height = '400px';
                iframe.style.border = '1px solid #475569';
                iframe.style.borderRadius = '8px';
                
                const container = document.createElement('div');
                container.appendChild(iframe);
                document.body.appendChild(container);
                
                log('✅ Main app iframe loaded');
            } catch (error) {
                log(`❌ Failed to load main app: ${error.message}`, 'error');
            }
        }

        function testAppStructure() {
            log('🧪 Testing app structure...');
            
            // Check if app.html exists
            fetch('/app.html')
                .then(response => {
                    if (response.ok) {
                        log('✅ app.html file accessible');
                        return response.text();
                    } else {
                        log('❌ app.html file not accessible', 'error');
                    }
                })
                .then(text => {
                    if (text) {
                        if (text.includes('window.app')) {
                            log('✅ App JavaScript structure found');
                        } else {
                            log('❌ App JavaScript structure not found', 'error');
                        }
                        
                        if (text.includes('firebase')) {
                            log('✅ Firebase integration found');
                        } else {
                            log('❌ Firebase integration not found', 'error');
                        }
                    }
                })
                .catch(error => {
                    log(`❌ Error testing app structure: ${error.message}`, 'error');
                });
        }

        function clearConsole() {
            consoleOutput.innerHTML = '';
            log('🧹 Console cleared');
        }

        // Auto-run basic tests on load
        window.addEventListener('load', () => {
            log('🚀 Simple test page loaded');
            log('Click buttons above to run tests');
        });
    </script>
</body>
</html>
