    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1E1E1E;
            --bg-tertiary: #2a2a2a;
            --text-primary: #F5F5F5;
            --text-secondary: #a0a0a0;
            --accent-primary: #D97706; /* Amber 600 */
            --accent-primary-hover: #B45309; /* Amber 700 */
            --destructive-primary: #DC2626; /* Red 600 */
            --destructive-primary-hover: #B91C1C; /* Red 700 */
            --success-primary: #16A34A; /* Green 600 */
            --income-color: #16A34A;
            --expense-color: #DC2626;
            --transfer-color: #a0a0a0;
        }
        
        .theme-teal { --accent-primary: #0D9488; --accent-primary-hover: #0F766E; }
        .theme-blue { --accent-primary: #2563EB; --accent-primary-hover: #1D4ED8; }
        .theme-crimson { --accent-primary: #DC2626; --accent-primary-hover: #B91C1C; }
        .theme-cyan { --accent-primary: #0891B2; --accent-primary-hover: #0E7490; }
        .theme-green { --accent-primary: #16A34A; --accent-primary-hover: #15803D; }

        html, body { background-color: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        input, textarea, select { background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid #4a4a4a; border-radius: 0.375rem; padding: 0.5rem; }
        textarea::placeholder, input::placeholder { color: var(--text-secondary); }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        
        .page { display: none; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .page.active { display: block; }

        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; transition: all 0.2s; border: none; cursor: pointer; text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-sm { padding: 0.25rem 0.75rem; font-size: 0.875rem; }
        .btn-primary { background-color: var(--accent-primary); color: white; }
        .btn-primary:hover:not(:disabled) { background-color: var(--accent-primary-hover); box-shadow: 0 0 15px var(--accent-primary-hover); }
        .btn-secondary { background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--bg-tertiary); }
        .btn-secondary:hover:not(:disabled) { background-color: #3a3a3a; }
        .btn-destructive { background-color: var(--destructive-primary); color: white; }
        .btn-destructive:hover:not(:disabled) { background-color: var(--destructive-primary-hover); }
        
        /* Desktop Sidebar */
        .sidebar-nav-item { transition: all 0.2s; }
        .sidebar-nav-item.active { background-color: var(--accent-primary); color: white; font-weight: 600; }
        .sidebar-nav-item.active svg { stroke: white; }
        .sidebar-nav-item:hover:not(.active) { background-color: var(--bg-tertiary); color: var(--accent-primary); }
        .sidebar-nav-item:hover:not(.active) svg { stroke: var(--accent-primary); }
        
        /* Mobile Bottom Nav */
        .bottom-nav { background-color: rgba(30, 30, 30, 0.8); backdrop-filter: blur(10px); border-top: 1px solid rgba(55, 55, 55, 0.5); }
        .mobile-nav-item.active svg, .mobile-nav-item.active span { color: var(--accent-primary); }

        .task-item-completed { text-decoration: line-through; opacity: 0.6; }
        
        #modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 40; display: none; backdrop-filter: blur(4px); }
        #modal-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 50; width: 90%; max-width: 550px; display: none; }
        .modal-content { background-color: var(--bg-secondary); border: 1px solid var(--bg-tertiary); border-radius: 0.75rem; padding: 1.5rem; max-height: 85vh; overflow-y: auto; }
        
        .loading-spinner { border: 4px solid var(--bg-tertiary); border-top: 4px solid var(--accent-primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bar-bg { background-color: var(--bg-tertiary); }
        .progress-bar-fg { background-color: var(--accent-primary); transition: width 0.3s ease-in-out; }

        .notification-popup {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            color: white;
            font-weight: 600;
            z-index: 100;
            animation: slide-in-out 3s forwards;
        }
        .notification-popup.success { background-color: var(--success-primary); }
        .notification-popup.error { background-color: var(--destructive-primary); }
        @keyframes slide-in-out {
            0% { transform: translateX(110%); opacity: 0; }
            15% { transform: translateX(0); opacity: 1; }
            85% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(110%); opacity: 0; }
        }

        .log-container { max-height: 400px; overflow-y: auto; }
        .log-item-clickable { cursor: pointer; transition: all 0.2s; }
        .log-item-clickable:hover { 
            background-color: var(--bg-tertiary);
            box-shadow: 0 0 15px color-mix(in srgb, var(--accent-primary) 20%, transparent);
            border-color: color-mix(in srgb, var(--accent-primary) 40%, transparent);
        }
        
        .bento-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 0.2s ease-in-out;
        }
        .bento-box-interactive:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px color-mix(in srgb, var(--accent-primary) 25%, transparent);
            border-color: color-mix(in srgb, var(--accent-primary) 50%, transparent);
        }
        
        .achievement-locked { 
            filter: grayscale(1);
            opacity: 0.5;
            cursor: pointer;
        }
        
        .text-accent-primary { color: var(--accent-primary); }
        .task-checkbox { accent-color: var(--accent-primary); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
        
        .flip-card { background-color: transparent; width: 100%; height: 120px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card:hover .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            box-sizing: border-box; position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 0.75rem; border: 1px solid var(--bg-tertiary);
        }
        .flip-card-front { background-color: var(--bg-secondary); }
        .flip-card-back { background-color: var(--bg-tertiary); transform: rotateY(180deg); padding: 0.75rem; }
        
        .protocol-week-btn { background-color: var(--bg-tertiary); }
        .protocol-week-btn:not(.selected):hover { background-color: var(--accent-primary-hover); color: white; }
        .protocol-week-btn.selected {
            background-color: var(--accent-primary);
            color: white;
            box-shadow: 0 0 15px var(--accent-primary);
            transform: scale(1.05);
        }

        /* Assessment Chat styles */
        .chat-container {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 100%;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: var(--bg-secondary); }
        .chat-container::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
        .chat-bubble-ai { background-color: #374151; color: #e5e7eb; border-radius: 20px 20px 20px 5px; animation: slideUp 0.3s ease-out; }
        .chat-bubble-user { background-color: var(--accent-primary); color: white; border-radius: 20px 20px 5px 20px; animation: slideUp 0.3s ease-out; }
        .chat-bubble-ai-typing {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-bubble-ai-typing span {
            width: 8px; height: 8px; background-color: #9ca3af; border-radius: 50%;
            animation: typing-bounce 1.2s infinite ease-in-out;
        }
        .chat-bubble-ai-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-bubble-ai-typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Mission Card styles */
        .mission-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .mission-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px color-mix(in srgb, var(--accent-primary) 30%, transparent); }

    </style>
</head>

            /**
             * Initializes the application, sets up dayjs, Firebase, and event listeners.
             */
            init() {
                dayjs.extend(window.dayjs_plugin_utc);
                dayjs.extend(window.dayjs_plugin_timezone);
                dayjs.extend(window.dayjs_plugin_isoWeek);
                dayjs.extend(window.dayjs_plugin_isToday);
                dayjs.extend(window.dayjs_plugin_dayOfYear);
                dayjs.tz.setDefault("America/New_York");
                this.state.currentDate = dayjs();

                this.showNotification = this.showNotification.bind(this);
                this.processNotificationQueue = this.processNotificationQueue.bind(this);

                this.initFirebase();
                this.initEventListeners();
            },

            /**
             * Initializes Firebase app, auth, and Firestore, and sets up auth state listener.
             */
            initFirebase() {
                const firebaseConfig = {
                    apiKey: "AIzaSyDZwdPoay31I8_IO4U_j60ggTgkV9Norms",
                    authDomain: "operation-uplift-os.firebaseapp.com",
                    projectId: "operation-uplift-os",
                    storageBucket: "operation-uplift-os.firebasestorage.app",
                    messagingSenderId: "357899909466",
                    appId: "1:357899909466:web:6ece33c09320abffd01b63"
                };

                try {
                    const app = initializeApp(firebaseConfig);
                    this.state.auth = getAuth(app);
                    this.state.db = getFirestore(app);
                    
                    onAuthStateChanged(this.state.auth, async (user) => {
                        if (user) {
                            this.state.userId = user.uid;
                            this.state.isAuthReady = true;
                            await this.loadUserData();
                        } else {
                            this.state.isAuthReady = true;
                            this.state.userData = null;
                            this.navigateTo('landing');
                        }
                    });
                } catch (error) {
                    console.error("Firebase initialization failed:", error);
                    this.showNotification("System configuration error.", 'error');
                }
            },

            /**
             * Sets up all major event listeners for the application.
             */
            initEventListeners() {
                document.getElementById('init-system-btn').addEventListener('click', () => this.handleAnonymousLogin());
                document.getElementById('login-btn').addEventListener('click', () => this.handleEmailLogin());
                document.getElementById('show-signup-link').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.showSignupModal();
                });
                
                document.getElementById('sidebar-nav').addEventListener('click', (e) => {
                    const navLink = e.target.closest('.sidebar-nav-item');
                    if (navLink) { e.preventDefault(); this.navigateTo(navLink.dataset.page); }
                });

                document.getElementById('bottom-nav').addEventListener('click', (e) => {
                    const navLink = e.target.closest('.mobile-nav-item');
                    if (navLink) { e.preventDefault(); this.navigateTo(navLink.dataset.page); }
                });
            },
            
            async handleAnonymousLogin() {
                if (!this.state.isAuthReady) return;
                try {
                    await signInAnonymously(this.state.auth);
                } catch (error) {
                    this.showNotification("System initialization failed.", 'error');
                }
            },

            async loadUserData() {
                if (!this.state.userId) return;
                const userDocRef = doc(this.state.db, "artifacts", this.state.appId, "users", this.state.userId);

                if (this.state.unsubscribe.userData) this.state.unsubscribe.userData();

                const docSnap = await getDoc(userDocRef);
                if (!docSnap.exists()) {
                    await this.createNewUser(userDocRef);
                }
                
                this.state.unsubscribe.userData = onSnapshot(userDocRef, (doc) => {
                    if (doc.exists()) {
                        const hadUserData = !!this.state.userData;
                        const previousData = JSON.parse(JSON.stringify(this.state.userData || {}));
                        this.state.userData = doc.data();
                        
                        if (!hadUserData) { 
                            this.checkForWeeklyReset();
                            this.listenToDailyTasks(this.state.currentDate);
                        }
                        
                        this.checkAllAchievements(previousData, this.state.userData, this.state.dailyTasks);
                        this.checkMissionProgress();

                        this.applyTheme(this.state.userData.settings.theme);
                        
                        if (!this.state.userData.assessment.isComplete) {
                            this.navigateTo('assessment');
                        } else if (!this.state.userData.tutorialCompleted) {
                            this.navigateTo('dashboard'); // Navigate to dash to show tutorial over it
                            this.startTutorial();
                        } else if (this.state.currentPage === 'landing' || this.state.currentPage === 'assessment') {
                            this.navigateTo('dashboard');
                        } else {
                            this.render(); // Just re-render the current page
                        }
                    }
                });
            },
            
            async createNewUser(userDocRef) {
                const isAnonymous = this.state.auth.currentUser.isAnonymous;
                const newUser = {
                    operatorName: `Operator-${this.state.userId.substring(0, 4)}`,
                    email: this.state.auth.currentUser.email || null,
                    level: 1, dp: 0,
                    stats: { DIS: 0, INT: 0, STR: 0, CHA: 0, RES: 0, CRE: 0 },
                    settings: { theme: 'default', hardMode: false },
                    immunityPasses: 1, missionStartDate: serverTimestamp(),
                    lastLoginDate: dayjs().subtract(1, 'day').format('YYYY-MM-DD'),
                    currentStreak: 0, longestStreak: 0, achievements: {},
                    protocolCompletion: {},
                    protocolProgress: { missionWeek: 1, tasks: {} },
                    finance: { balances: { bank: 0, crypto: 0 }, debts: [], goals: [], transactions: [] },
                    logCount: 0, journalCount: 0, aiAssistCount: 0, aiPromptCount: 0,
                    transferCount: 0, isAnonymous: isAnonymous,
                    assessment: {
                        currentQuestionIndex: 0,
                        userResponses: {},
                        isComplete: false,
                        completionRewardClaimed: false,
                        chatHistory: [],
                    },
                    missions: {
                        available: [],
                        active: [],
                        completed: []
                    },
                    tutorialCompleted: false,
                };
                await setDoc(userDocRef, newUser);
            },
            
            navigateTo(page) {
                if (this.state.userData && !this.state.userData.assessment.isComplete && page !== 'assessment') {
                    this.showNotification("Calibration in progress. Complete the assessment.", "error");
                    return;
                }
                this.state.currentPage = page;
                this.render();
            },

            render() {
                if (!this.state.isAuthReady) return;

                if (!this.state.userData) {
                    document.getElementById('page-landing').classList.add('active');
                    document.getElementById('app-container').classList.add('hidden');
                    return; 
                }
                
                document.getElementById('page-landing').classList.remove('active');
                document.getElementById('app-container').classList.remove('hidden');

                const assessmentComplete = this.state.userData.assessment.isComplete;
                
                document.getElementById('sidebar-nav').style.display = assessmentComplete ? 'flex' : 'none';
                document.getElementById('bottom-nav').style.display = assessmentComplete ? 'flex' : 'none';

                if (assessmentComplete) {
                    this.renderSidebar();
                    this.renderMobileNav();
                }

                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                
                const activePage = document.getElementById(`page-${this.state.currentPage}`);
                if (activePage) activePage.classList.add('active');

                if (this.state.currentPage === 'intel' && assessmentComplete) {
                    this.renderIntelHub();
                    return;
                }

                switch (this.state.currentPage) {
                    case 'dashboard': this.renderDashboard(); break;
                    case 'assessment': this.renderAssessment(); break;
                    case 'missions': this.renderMissionsPage(); break;
                    case 'protocol': this.renderProtocol(); break;
                    case 'tradelog': this.renderTradeLogPage(); break;
                    case 'journal': this.renderJournalPage(); break;
                    case 'finance': this.renderFinancePage(); break;
                    case 'achievements': this.renderAchievementsPage(); break;
                    case 'settings': this.renderSettings(); break;
                }
            },

            renderDashboard() {

                    return;

                const { operatorName, level, dp, stats } = this.state.userData;

                const rank = this.config.ranks.slice().reverse().find(r => level >= r.minLevel)?.name || 'Recruit';
                const dpForNextLevel = 100 + (level * 20);
                const dpProgress = dpForNextLevel > 0 ? (dp / dpForNextLevel) * 100 : 0;

                const tasksHTML = this.state.dailyTasks.map(task => `

                const statOrder = ['DIS', 'INT', 'STR', 'CHA', 'RES', 'CRE'];

                            </div>
                            <div class="w-full progress-bar-bg rounded-full h-2.5">
                                <div class="progress-bar-fg h-2.5 rounded-full" style="width: ${dpProgress}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-3xl font-bold flex items-center gap-3"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>Dashboard</h1>

                            </button>
                            <button id="next-day-btn" class="p-2 rounded-full bg-secondary hover:bg-tertiary" ${isToday ? 'disabled' : ''}>
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                `;

                const debriefBtn = document.getElementById('daily-debrief-btn');

                const container = document.getElementById('page-assessment');

                if (assessment.isComplete) {
                    container.innerHTML = `

                    if (!assessment.completionRewardClaimed) {
                        this.addDP(50);

                        this.checkAndGrantAchievement('ASSESSMENT_COMPLETE', true);
                    }
                    return;
                }
                
                container.innerHTML = `
                    <div class="h-full flex flex-col bg-secondary rounded-lg">

                        </div>
                    </div>
                `;
                
                this.rebuildChatHistory();
                this.updateAssessmentProgress();

            renderMissionsPage() {
                const container = document.getElementById('page-missions');
                
                if (!this.state.userData.assessment.isComplete) {
                    container.innerHTML = `

                    return `
                    <div class="mission-card bg-secondary p-5 rounded-lg shadow-lg">

                            <div>

                        <div class="flex items-center gap-3">
                            <span class="text-2xl">${m.icon}</span>

                                <h4 class="font-semibold">${m.title}</h4>

            renderProtocol() {
                const container = document.getElementById('page-protocol');
                const selectedWeek = this.state.uiState.protocolSelectedWeek;
                const weekData = this.config.riseSchedule[selectedWeek];
                const protocolCompletion = this.state.userData.protocolCompletion || {};
                const currentMissionWeek = this.state.userData.protocolProgress?.missionWeek || 1;
                const protocolProgress = this.state.userData.protocolProgress?.tasks || {};
                
                const weekButtonsHTML = Object.keys(this.config.riseSchedule).map(week => `
                    <button class="protocol-week-btn flex-shrink-0 px-4 py-2 rounded-md text-sm font-semibold transition-all duration-200 ${parseInt(week) === selectedWeek ? 'selected' : ''}" data-week="${week}">
                        Week ${week}
                    </button>
                `).join('');

                const getIconForTask = (taskName) => {
                    const lowerCaseTask = taskName.toLowerCase();
                    if (lowerCaseTask.includes('study') || lowerCaseTask.includes('read')) return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`;
                    if (lowerCaseTask.includes('pushup') || lowerCaseTask.includes('run') || lowerCaseTask.includes('workout')) return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>`;
                    if (lowerCaseTask.includes('meditate') || lowerCaseTask.includes('social media') || lowerCaseTask.includes('wakeup')) return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 00-2.47 1.76.94.94 0 01-1.25.27l-1.1-1.1a1 1 0 00-1.41 1.41l1.1 1.1c.21.21.3.53.27 1.25A10 10 0 002 12a10 10 0 008.24 9.53c.72.1.94.27 1.25.27l1.1 1.1a1 1 0 001.41-1.41l-1.1-1.1a.94.94 0 01-.27-1.25A10 10 0 0022 12a10 10 0 00-9.53-8.24c-.72-.1-.94-.27-1.25-.27l-1.1-1.1a1 1 0 00-1.41 1.41l1.1 1.1c.21.21.3.53.27 1.25A10 10 0 0012 2z"></path><path d="M12 6a6 6 0 100 12 6 6 0 000-12z"></path><path d="M12 10a2 2 0 100 4 2 2 0 000-4z"></path></svg>`;
                    if (lowerCaseTask.includes('water')) return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>`;
                    return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`;
                };
                
                const weekDetailsHTML = weekData ? Object.values(weekData).map(task => {
                    let completedCount = 0;
                    if (selectedWeek < currentMissionWeek) {
                        completedCount = task.freq; // Assume past weeks are fully completed if week is marked
                    } else if (selectedWeek === currentMissionWeek) {
                        completedCount = protocolProgress[task.text] || 0;
                    }
                    const isTaskCompleteForWeek = completedCount >= task.freq;

                    return `
                    <div class="flip-card">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                ${isTaskCompleteForWeek ? '<div class="absolute inset-0 bg-black/50 flex items-center justify-center rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--success-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>' : ''}
                                <div class="w-10 h-10 text-accent-primary mb-2 flex items-center justify-center">${getIconForTask(task.text)}</div>
                                <p class="font-semibold capitalize text-sm">${task.text}</p>
                                <p class="text-xs text-secondary mt-1">(${completedCount}/${task.freq}) per week</p>
                            </div>
                            <div class="flip-card-back">
                                <p class="font-bold text-accent-primary">+${task.dp} DP / +1 ${task.stat}</p>
                            </div>
                        </div>
                    </div>
                `}).join('') : '';

                const allTasksForWeekComplete = weekData ? Object.values(weekData).every(task => (protocolProgress[task.text] || 0) >= task.freq) : false;
                const isPreviousWeekComplete = selectedWeek === 1 || protocolCompletion[`week_${selectedWeek - 1}`];
                const canComplete = !protocolCompletion[`week_${selectedWeek}`] && isPreviousWeekComplete && allTasksForWeekComplete;
                
                let completeButtonTitle = '';
                if (protocolCompletion[`week_${selectedWeek}`]) {
                    completeButtonTitle = 'Week already completed';
                } else if (!isPreviousWeekComplete) {
                    completeButtonTitle = 'Complete previous week first';
                } else if (!allTasksForWeekComplete) {
                    completeButtonTitle = 'Not all objectives met for this week';
                }

                container.innerHTML = `
                    <h1 class="text-3xl font-bold mb-6 flex items-center gap-3"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Weekly Protocol</h1>
                    <div class="mb-6">
                        <div class="flex space-x-2 overflow-x-auto pb-2">
                            ${weekButtonsHTML}
                        </div>
                    </div>
                    <div class="bento-box">
                        <div class="flex flex-col md:flex-row justify-between md:items-center mb-6 gap-4">
                             <div>
                                <h3 class="text-2xl font-bold">Week ${selectedWeek} Objectives</h3>
                                <p class="text-secondary">Hover over a card to see rewards.</p>
                             </div>
                             <button id="complete-week-btn" class="btn btn-primary" ${!canComplete ? 'disabled' : ''} title="${completeButtonTitle}">
                                ${protocolCompletion[`week_${selectedWeek}`] ? 'Week Complete' : 'Mark Week Complete'}
                             </button>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                            ${weekDetailsHTML}
                        </div>
                    </div>
                `;

                container.querySelectorAll('.protocol-week-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.state.uiState.protocolSelectedWeek = parseInt(e.currentTarget.dataset.week);
                        this.renderProtocol();
                    });
                });
                
                document.getElementById('complete-week-btn').addEventListener('click', () => this.markWeekAsComplete(selectedWeek));
            },

            rebuildChatHistory() {
                const chatContainer = document.getElementById('chat-container');
                if (!chatContainer) return;
                
                const assessment = this.state.userData.assessment;
                chatContainer.innerHTML = '';
                assessment.chatHistory.forEach(msg => this.addChatMessage(msg.text, msg.sender, false));

                if (this.state.uiState.isAiTyping) {
                    this.showTypingIndicator();
                }
                
                // Set initial question if chat is empty
                if (assessment.chatHistory.length === 0) {
                    const firstQuestion = this.config.assessmentQuestions[0];
                    this.addChatMessage(firstQuestion.text, 'ai');
                    this.updateUserAssessmentState({ chatHistory: [{ sender: 'ai', text: firstQuestion.text }]});
                }
            },

            addChatMessage(text, sender, shouldAnimate = true) {
                const chatContainer = document.getElementById('chat-container');
                if (!chatContainer) return;

                const bubble = document.createElement('div');
                bubble.className = `p-3 mb-3 max-w-lg w-fit shadow ${sender === 'ai' ? 'chat-bubble-ai self-start' : 'chat-bubble-user self-end'}`;
                if (!shouldAnimate) bubble.style.animation = 'none';
                bubble.textContent = text;
                
                chatContainer.appendChild(bubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            },

            async handleAssessmentInput() {
                const inputBox = document.getElementById('assessment-input-box');
                const text = inputBox.value.trim();
                if (text === '' || inputBox.disabled) return;

                const assessment = this.state.userData.assessment;
                const currentQuestion = this.config.assessmentQuestions[assessment.currentQuestionIndex];
                
                inputBox.disabled = true;
                document.getElementById('assessment-send-btn').disabled = true;
                
                const updatedChat = [...assessment.chatHistory, { sender: 'user', text }];
                this.addChatMessage(text, 'user');
                inputBox.value = '';

                const nextIndex = assessment.currentQuestionIndex + 1;
                const isNowComplete = nextIndex >= this.config.assessmentQuestions.length - 1;

                await this.updateUserAssessmentState({
                    chatHistory: updatedChat,
                    [`userResponses.${currentQuestion.id}`]: text,
                    currentQuestionIndex: nextIndex,
                    isComplete: isNowComplete
                });
                
                this.updateAssessmentProgress();
                
                if (!isNowComplete) {
                    this.askNextQuestion();
                } else {
                    this.processAssessment();
                }
            },
            
            async askNextQuestion() {
                const assessment = this.state.userData.assessment;
                const question = this.config.assessmentQuestions[assessment.currentQuestionIndex];
                
                this.state.uiState.isAiTyping = true;
                this.showTypingIndicator();

                setTimeout(async () => {
                    this.state.uiState.isAiTyping = false;
                    this.hideTypingIndicator();
                    
                    this.addChatMessage(question.text, 'ai');
                    const updatedChat = [...this.state.userData.assessment.chatHistory, { sender: 'ai', text: question.text }];
                    await this.updateUserAssessmentState({ chatHistory: updatedChat });
                    
                    const inputBox = document.getElementById('assessment-input-box');
                    const sendBtn = document.getElementById('assessment-send-btn');
                    if(inputBox) inputBox.disabled = false;
                    if(sendBtn) sendBtn.disabled = false;
                    inputBox.focus();

                }, 1200); // Simulate AI thinking time
            },

            showTypingIndicator() {
                const chatContainer = document.getElementById('chat-container');
                if (!chatContainer || document.getElementById('typing-indicator')) return;
                const indicator = document.createElement('div');
                indicator.id = 'typing-indicator';
                indicator.className = 'p-3 mb-3 max-w-lg w-fit shadow chat-bubble-ai self-start chat-bubble-ai-typing';
                indicator.innerHTML = `<span></span><span></span><span></span>`;
                chatContainer.appendChild(indicator);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            },

            hideTypingIndicator() {
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
            },

            updateAssessmentProgress() {
                const progressBar = document.getElementById('assessment-progress-bar');
                if (!progressBar) return;

                const progress = (this.state.userData.assessment.currentQuestionIndex / (this.config.assessmentQuestions.length -1)) * 100;
                progressBar.style.width = `${Math.min(progress, 100)}%`;
            },
            
            async processAssessment() {
                this.hideTypingIndicator();
                const endMessage = this.config.assessmentQuestions.find(q => q.type === 'end').text;
                this.addChatMessage(endMessage, 'ai');
                
                const updatedChat = [...this.state.userData.assessment.chatHistory, { sender: 'ai', text: endMessage }];
                await this.updateUserAssessmentState({ chatHistory: updatedChat });

                this.generateInitialMissions();
                
                setTimeout(() => this.render(), 1000); // Re-render the completed view
            },

            async updateUserAssessmentState(updates) {
                const userRef = doc(this.state.db, "artifacts", this.state.appId, "users", this.state.userId);
                const updatePayload = {};
                for (const key in updates) {
                    updatePayload[`assessment.${key}`] = updates[key];
                }
                await updateDoc(userRef, updatePayload);
            },

            async checkForWeeklyReset() {
                 if (!this.state.userData.missionStartDate || !this.state.userData.missionStartDate.toDate) return;
                 const missionStart = dayjs(this.state.userData.missionStartDate.toDate());
                 const currentMissionWeek = dayjs().diff(missionStart, 'week') + 1;
                 
                 if (this.state.userData.protocolProgress?.missionWeek !== currentMissionWeek) {
                     await updateDoc(doc(this.state.db, "artifacts", this.state.appId, "users", this.state.userId), {
                         protocolProgress: { missionWeek: currentMissionWeek, tasks: {} }
                     });
                 }
            },
            
            listenToDailyTasks(date) {
                if (this.state.unsubscribe.tasks) this.state.unsubscribe.tasks(); 
                
                const dateStr = date.format('YYYY-MM-DD');
                const tasksColRef = collection(this.state.db, "artifacts", this.state.appId, "users", this.state.userId, "tasks");
                const q = query(tasksColRef, where("date", "==", dateStr));

                this.state.unsubscribe.tasks = onSnapshot(q, async (snapshot) => {
                    if (snapshot.empty && date.isSame(dayjs(), 'day')) {
                        await this.generateAndSaveDailyTasks(date);
                    } else {
                        this.state.dailyTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        this.checkAllAchievements(this.state.userData, this.state.userData, this.state.dailyTasks);
                        if(this.state.currentPage === 'dashboard' || this.state.currentPage === 'protocol') this.render();
                    }
                }, error => {
                    console.error("Error listening to daily tasks:", error);
                    this.showNotification("Error loading daily tasks.", "error");
                });
            },

            async generateAndSaveDailyTasks(date) {
                const missionStart = this.state.userData.missionStartDate?.toDate() ? dayjs(this.state.userData.missionStartDate.toDate()) : dayjs();
                const weekNumber = date.diff(missionStart, 'week') + 1;

                let tasksToGenerate = [...this.config.defaultTasks.map(t => ({...t, completed: false}))];

                const weekSchedule = this.config.riseSchedule[weekNumber];
                if (weekSchedule) {
                    // This function now distributes tasks more evenly
                    const getScheduledDaysForTask = (taskName, freq, week) => {
                        let days = [];
                        let seed = week;
                        for(let char of taskName) { seed += char.charCodeAt(0); }
                        
                        let availableDays = [1, 2, 3, 4, 5, 6, 7];
                        for(let i = 0; i < freq; i++) {
                            const index = (seed + i) % availableDays.length;
                            days.push(availableDays.splice(index, 1)[0]);
                        }
                        return days;
                    };

                    Object.values(weekSchedule).forEach(task => {
                        if (task.freq === 7) {
                            tasksToGenerate.push({ ...task, completed: false });
                        } else {
                            const scheduledDays = getScheduledDaysForTask(task.text, task.freq, weekNumber);
                            if (scheduledDays.includes(date.isoWeekday())) {
                                if (!tasksToGenerate.some(t => t.text === task.text)) {
                                    tasksToGenerate.push({ ...task, completed: false });
                                }
                            }
                        }
                    });
                }

                 const batch = writeBatch(this.state.db);
                 const tasksColRef = collection(this.state.db, "artifacts", this.state.appId, "users", this.state.userId, "tasks");
                 tasksToGenerate.forEach(task => {
                     const newTaskRef = doc(tasksColRef);
                     batch.set(newTaskRef, { date: date.format('YYYY-MM-DD'), ...task });
                 });
                 await batch.commit();
            },

            async checkAllAchievements(previousData, currentData, dailyTasks = []) {
                if (!previousData || !currentData) return;

                const userAchievements = currentData.achievements || {};
                const achievementsToGrant = {};
                let totalDpFromAchievements = 0;

                for (const [id, ach] of Object.entries(this.config.achievements)) {
                    if (!userAchievements[id]) {
                        if (ach.check(currentData, previousData, dailyTasks)) {
                           achievementsToGrant[`achievements.${id}`] = { unlockedAt: serverTimestamp() };
                           totalDpFromAchievements += ach.dp;
                           this.showNotification(`Achievement Unlocked: ${ach.name} ${ach.emoji}`, "success");
                        }
                    }
                }

                if (Object.keys(achievementsToGrant).length > 0) {
                    const userRef = doc(this.state.db, "artifacts", this.state.appId, "users", this.state.userId);
                    await updateDoc(userRef, achievementsToGrant);
                    if (totalDpFromAchievements > 0) {
                        await this.addDP(totalDpFromAchievements);
                    }
                }
            },
            
            async checkAndGrantAchievement(id, forceGrant = false) {
                if (!this.state.userData) return;
                const ach = this.config.achievements[id];
                if (!ach) return;

                const userAchievements = this.state.userData.achievements || {};
                if (userAchievements[id]) return; // Already unlocked

                if (forceGrant) {
                    const userRef = doc(this.state.db, "artifacts", this.state.appId, "users", this.state.userId);
                    try {
                        await updateDoc(userRef, {
                            [`achievements.${id}`]: { unlockedAt: serverTimestamp() }
                        });
                        await this.addDP(ach.dp);
                        this.showNotification(`Achievement Unlocked: ${ach.name} ${ach.emoji}`, "success");
                    } catch (error) {
                        console.error(`Failed to grant achievement ${id}:`, error);
                        this.showNotification("Error updating achievements.", "error");
                    }
                }
            },

            updatePwaAssets(colorHex) {
                document.getElementById('theme-color-meta').content = colorHex;

                const generateIcon = (size, color) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-secondary').trim();
                    ctx.fillRect(0, 0, size, size);

                    const logoPath = new Path2D("M50 2 L90 25 L90 75 L50 98 L10 75 L10 25 Z M30 60 L50 50 L70 60 M50 50 L50 20");
                    ctx.save();
                    ctx.scale(size / 100, size / 100);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 4;
                    ctx.stroke(logoPath);
                    ctx.restore();

                    return canvas.toDataURL('image/png');
                };

                const icon180 = generateIcon(180, colorHex);
                const icon192 = generateIcon(192, colorHex);
                const icon512 = generateIcon(512, colorHex);

                document.getElementById('apple-touch-icon-link').href = icon180;
                
                const faviconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 2 L90 25 L90 75 L50 98 L10 75 L10 25 Z' stroke='${encodeURIComponent(colorHex)}' stroke-width='4' fill='none'/><path d='M30 60 L50 50 L70 60' stroke='${encodeURIComponent(colorHex)}' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M50 50 L50 20' stroke='${encodeURIComponent(colorHex)}' stroke-width='4' fill='none' stroke-linecap='round'/></svg>`;

                    start_url: "/",
                    display: "standalone",
                    background_color: "#121212",
                    theme_color: colorHex,
                    icons: [
                        { src: icon192, sizes: "192x192", type: "image/png" },
                        { src: icon512, sizes: "512x512", type: "image/png" }
                    ]
                };
                const manifestString = JSON.stringify(manifest);
                const manifestBlob = new Blob([manifestString], {type: 'application/json'});
                const manifestUrl = URL.createObjectURL(manifestBlob);
                document.getElementById('manifest-link').href = manifestUrl;

                this.state.notificationQueue.push({ message, type });

            processNotificationQueue() {
                if (this.state.notificationQueue.length === 0) {
                    this.state.isNotifying = false;
                    return;
                }
                this.state.isNotifying = true;
                const { message, type } = this.state.notificationQueue.shift();

                const notification = document.createElement('div');
                notification.className = `notification-popup ${type}`;
                notification.innerText = message;
                
                document.body.appendChild(notification);

                setTimeout(() => {

                    }
                    this.processNotificationQueue();
                }, 3000);

            async addDP(dpToAdd, statKey = null, statPoints = 0) {
                const userRef = doc(this.state.db, "artifacts", this.state.appId, "users", this.state.userId);
                try {
                    await runTransaction(this.state.db, async (transaction) => {
                        const userDoc = await transaction.get(userRef);
                        if (!userDoc.exists()) throw "User not found";

                        let { dp, level, stats } = userDoc.data();
                        
                        dp = Number(dp) || 0;
                        level = Number(level) || 1;
                        dp += dpToAdd;

                        if(statKey && stats.hasOwnProperty(statKey)) {
                            stats[statKey] = (stats[statKey] || 0) + statPoints;
                        }

                        let dpForNextLevel = 100 + (level * 20);

                        while (dp >= dpForNextLevel) {
                            dp -= dpForNextLevel;
                            level++;
                            dpForNextLevel = 100 + (level * 20);
                        }

                        while (dp < 0) {
                            if (level === 1) {
                                dp = 0;
                                break;
                            }
                            level--;
                            const dpForPreviousLevel = 100 + (level * 20);
                            dp += dpForPreviousLevel;
                        }
                        
                        transaction.update(userRef, { dp, level, stats });
                    });
                } catch (e) {
                    console.error("Add DP Transaction failed: ", e);
                }
            },

            async toggleTaskCompletion(taskId, isCompleted) {
                const taskRef = doc(this.state.db, "artifacts", this.state.appId, "users", this.state.userId, "tasks", taskId);
                const taskSnap = await getDoc(taskRef);

                if (!taskSnap.exists() || taskSnap.data().completed === isCompleted) return;

                const task = taskSnap.data();
                const dpChange = isCompleted ? task.dp : -task.dp;
                const statChange = isCompleted ? 1 : -1;
                
                await this.addDP(dpChange, task.stat, statChange);
                await updateDoc(taskRef, { completed: isCompleted });

                // Update weekly protocol progress
                if (this.state.userData.missionStartDate?.toDate) {
                    const missionStart = dayjs(this.state.userData.missionStartDate.toDate());
                    const currentMissionWeek = dayjs().diff(missionStart, 'week') + 1;
                    const weekSchedule = this.config.riseSchedule[currentMissionWeek];
                    
                    if (weekSchedule && weekSchedule[task.text]) {
                        const currentProgress = this.state.userData.protocolProgress || { missionWeek: currentMissionWeek, tasks: {} };
                        if (currentProgress.missionWeek === currentMissionWeek) {
                            const taskKey = `protocolProgress.tasks.${task.text}`;
                            await updateDoc(doc(this.state.db, "artifacts", this.state.appId, "users", this.state.userId), {
                                [taskKey]: increment(isCompleted ? 1 : -1)
                            });
                        }
                    }
                }
            },

            async callGemini(prompt, responseSchema = null) {
                const apiKey = "AIzaSyCqCiT_KqlhMdacpVG2D7ZsIc4FCXHh3uc"; // User-provided key
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }]
                };

                if (responseSchema) {
                    payload.generationConfig = {
                        response_mime_type: "application/json",
                        response_schema: responseSchema,
                    };
                }

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        const errorBody = await response.text();
                        console.error(`Gemini API error: ${response.status} ${response.statusText}`, errorBody);
                        throw new Error(`AI service returned an error. Status: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    
                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        const text = result.candidates[0].content.parts[0].text;
                        return responseSchema ? JSON.parse(text) : text;
                    } else {
                        console.error("Unexpected API response structure:", result);
                        this.showNotification("AI returned an unexpected response.", "error");
                        return null;
                    }
                } catch (error) {
                    console.error("Gemini API Call Error:", error);
                    this.showNotification("AI module offline. Please try again later.", "error");

                }

                    .replace(/\n/g, '<br>');
            },
