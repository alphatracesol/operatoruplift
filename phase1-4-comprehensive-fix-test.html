        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLogs() {
            document.getElementById('results').innerHTML = '';
        }

        function updatePhaseStatus(phase, status) {
            const statusElement = document.getElementById(`${phase}-status`);
            statusElement.className = `phase-status phase-${status}`;
            statusElement.textContent = `Phase ${phase.charAt(5)}: ${status.charAt(0).toUpperCase() + status.slice(1)}`;

                };
                
                // Trigger a test error

        function applyPhase1Fix(fixType) {
            log(`🔧 Applying Phase 1 fix for: ${fixType}`, 'warning');
            
            switch (fixType) {
                case 'SafeElementAccess':
                    // Apply SafeElementAccess fix
                    window.SafeElementAccess = {
                        getById: (id, fallback = null) => {
                            const element = document.getElementById(id);
                            return element || fallback;
                        },
                        query: (selector, parent = document) => {
                            try {
                                return parent.querySelector(selector);
                            } catch (error) {
                                console.warn(`Error querying selector '${selector}':`, error);
                                return null;
                            }
                        }
                    };
                    log('✅ SafeElementAccess fix applied', 'success');
                    break;
                    
                case 'SecurityUtils':
                    // Apply SecurityUtils fix
                    window.SecurityUtils = {
                        sanitizeInput: (input) => {
                            if (typeof input !== 'string') return '';
                            return input.replace(/[<>]/g, '');
                        },
                        validateEmail: (email) => {
                            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                            return emailRegex.test(email);
                        }
                    };
                    log('✅ SecurityUtils fix applied', 'success');
                    break;
                    
                case 'PerformanceUtils':
                    // Apply PerformanceUtils fix
                    window.PerformanceUtils = {
                        debounce: (func, wait) => {
                            let timeout;
                            return function executedFunction(...args) {
                                const later = () => {
                                    clearTimeout(timeout);
                                    func(...args);
                                };
                                clearTimeout(timeout);
                                timeout = setTimeout(later, wait);
                            };
                        },
                        throttle: (func, limit) => {
                            let inThrottle;
                            return function() {
                                const args = arguments;
                                const context = this;
                                if (!inThrottle) {
                                    func.apply(context, args);
                                    inThrottle = true;
                                    setTimeout(() => inThrottle = false, limit);
                                }
                            };
                        }
                    };
                    log('✅ PerformanceUtils fix applied', 'success');
                    break;
                    
                case 'ErrorBoundary':
                    // Apply ErrorBoundary fix
                    window.ErrorBoundary = {
                        catchError: (error, context = '') => {
                            console.error(`Error in ${context}:`, error);
                            return {
                                error: error.message,
                                context: context,
                                timestamp: new Date().toISOString()
                            };
                        }
                    };
                    log('✅ ErrorBoundary fix applied', 'success');
                    break;
                    
                case 'MemoryManager':
                    // Apply MemoryManager fix
                    window.memoryManager = {
                        intervals: new Set(),
                        addInterval: (intervalId) => {
                            this.intervals.add(intervalId);
                        },
                        cleanup: () => {
                            this.intervals.forEach(id => clearInterval(id));
                            this.intervals.clear();
                        }
                    };
                    log('✅ MemoryManager fix applied', 'success');
                    break;
                    
                case 'ZIndexManager':
                    // Apply ZIndexManager fix
                    window.zIndexManager = {
                        layers: {
                            modal: 1000,
                            overlay: 999,
                            dropdown: 998
                        },
                        getZIndex: (layer) => {
                            return this.layers[layer] || 1;
                        }
                    };
                    log('✅ ZIndexManager fix applied', 'success');
                    break;
            }
        }

        async function runAllPhases() {
            log('🚀 Starting comprehensive Phase 1-4 testing and fixing...', 'info');
            clearLogs();
            
            // Run phases sequentially
            await testPhase1();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testPhase2();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testPhase3();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testPhase4();
            
            // Final summary
            const totalTests = Object.values(testResults).reduce((sum, phase) => sum + phase.tests, 0);
            const totalErrors = Object.values(testResults).reduce((sum, phase) => sum + phase.errors, 0);
            const totalFixes = Object.values(testResults).reduce((sum, phase) => sum + phase.fixes, 0);
            const successRate = totalTests > 0 ? ((totalTests - totalErrors) / totalTests * 100).toFixed(1) : 0;
            
            log(`📊 FINAL SUMMARY: ${totalTests - totalErrors}/${totalTests} tests passed (${successRate}% success rate)`, 'info');
            log(`🔧 Total fixes applied: ${totalFixes}`, 'info');
            
            if (totalErrors === 0) {
                log('🎉 ALL PHASES COMPLETED SUCCESSFULLY!', 'success');
            } else {
                log(`⚠️ ${totalErrors} tests failed across all phases.`, 'warning');
            }
        }

        // Auto-run when page loads
        document.addEventListener('DOMContentLoaded', () => {
            log('📋 Phase 1-4 Comprehensive Fix & Test Suite loaded', 'info');
            log('Click "Run All Phases" to start comprehensive testing and fixing', 'info');
        });
    </script>
</body>
