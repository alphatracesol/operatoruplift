<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Uplift - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-color: #f97316;
            --accent-hover: #ea580c;
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #ffffff;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(249, 115, 22, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(249, 115, 22, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(249, 115, 22, 0.05) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-10px, -10px) scale(1.05); }
            50% { transform: translate(10px, -5px) scale(1.02); }
            75% { transform: translate(-5px, 10px) scale(1.03); }
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .login-card:hover::before {
            left: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-color), #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-color), #ff6b35);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-color);
        }

        .form-toggle {
            text-align: center;
            margin-top: 1rem;
        }

        .form-toggle a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .form-toggle a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        /* Music controls */
        .music-controls {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1000;
        }

        .music-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.15);
        }

        .music-btn.muted {
            opacity: 0.5;
        }

        /* Loading animation */
        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error/Success messages */
        .message {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            
            .login-card {
                padding: 2rem;
            }
            
            .logo h1 {
                font-size: 2rem;
            }
            
            .music-controls {
                top: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Music Controls -->
    <div class="music-controls">
        <button class="music-btn" id="music-toggle" title="Toggle Music">
            🎵
        </button>
    </div>

    <!-- Background Music -->
    <audio id="background-music" loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="container">
        <div class="login-card">
            <div class="logo">
                <h1>Operator Uplift</h1>
                <p>Elevate Your Goals</p>
            </div>

            <!-- Messages -->
            <div class="message" id="message"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">
                    <span class="btn-text">Login</span>
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </button>
                <div class="form-toggle">
                    <a href="#" id="show-register">Don't have an account? Register</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label for="register-name">Display Name</label>
                    <input type="text" id="register-name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="Enter your password (min. 6 characters)" minlength="6" required>
                </div>
                <button type="submit" class="btn">
                    <span class="btn-text">Register</span>
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </button>
                <div class="form-toggle">
                    <a href="#" id="show-login">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Music functionality
        const music = document.getElementById('background-music');
        const musicToggle = document.getElementById('music-toggle');
        let isMusicPlaying = false;
        let isMuted = false;

        // Set initial volume to 10%
        music.volume = 0.1;

        // Music toggle functionality
        musicToggle.addEventListener('click', () => {
            if (isMuted) {
                // Unmute
                music.volume = 0.1;
                musicToggle.textContent = '🎵';
                musicToggle.classList.remove('muted');
                isMuted = false;
            } else {
                // Mute
                music.volume = 0;
                musicToggle.textContent = '🔇';
                musicToggle.classList.add('muted');
                isMuted = true;
            }
        });

        // Auto-play music when page loads (with user interaction)
        document.addEventListener('click', () => {
            if (!isMusicPlaying) {
                music.play().then(() => {
                    isMusicPlaying = true;
                    console.log('Music started playing');
                }).catch(error => {
                    console.log('Music autoplay failed:', error);
                });
            }
        }, { once: true });

        // Form switching
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const showRegister = document.getElementById('show-register');
        const showLogin = document.getElementById('show-login');

        showRegister.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
        });

        showLogin.addEventListener('click', (e) => {
            e.preventDefault();
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        });

        // Message display function
        function showMessage(text, type = 'error') {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type} show`;
            setTimeout(() => {
                message.classList.remove('show');
            }, 5000);
        }

        // Loading state function
        function setLoading(form, loading) {
            const btn = form.querySelector('.btn');
            const btnText = btn.querySelector('.btn-text');
            const loadingDiv = btn.querySelector('.loading');
            
            if (loading) {
                btnText.style.display = 'none';
                loadingDiv.classList.add('show');
                btn.disabled = true;
            } else {
                btnText.style.display = 'block';
                loadingDiv.classList.remove('show');
                btn.disabled = false;
            }
        }

        // Login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                showMessage('Please fill in all fields');
                return;
            }
            
            setLoading(loginForm, true);
            
            try {
                // Simulate login process
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Store login data in localStorage for the main app
                localStorage.setItem('loginEmail', email);
                localStorage.setItem('loginPassword', password);
                localStorage.setItem('isLoggedIn', 'true');
                
                showMessage('Login successful! Redirecting...', 'success');
                
                // Redirect to AI chat interface for personality assessment
                setTimeout(() => {
                    window.location.href = 'ai-chat-interface.html';
                }, 1000);
                
            } catch (error) {
                showMessage('Login failed. Please try again.');
            } finally {
                setLoading(loginForm, false);
            }
        });

        // Register form submission
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            
            if (!name || !email || !password) {
                showMessage('Please fill in all fields');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long');
                return;
            }
            
            setLoading(registerForm, true);
            
            try {
                // Simulate registration process
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Store registration data in localStorage for the main app
                localStorage.setItem('registerName', name);
                localStorage.setItem('registerEmail', email);
                localStorage.setItem('registerPassword', password);
                localStorage.setItem('isRegistered', 'true');
                
                showMessage('Registration successful! You can now login.', 'success');
                
                // Switch back to login form
                setTimeout(() => {
                    registerForm.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    document.getElementById('login-email').value = email;
                }, 1000);
                
            } catch (error) {
                showMessage('Registration failed. Please try again.');
            } finally {
                setLoading(registerForm, false);
            }
        });

        // Check if user is already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            // Check if AI personality is already set
            if (localStorage.getItem('aiPersonalitySet') === 'true') {
                window.location.href = 'app.html';
            } else {
                window.location.href = 'ai-chat-interface.html';
            }
        }

        console.log('Login page loaded successfully');
    </script>
    
    <!-- Critical fixes and utilities -->
    <script src="critical-fixes.js"></script>
</body>
</html>
