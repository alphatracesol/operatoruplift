<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Analysis Test</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e5e7eb;
            margin: 20px;
            line-height: 1.6;
        }
        .test-section {
            background: rgba(24, 24, 27, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 4px solid;
        }
        .passed { background: rgba(16, 185, 129, 0.1); border-color: #10b981; }
        .warning { background: rgba(245, 158, 11, 0.1); border-color: #f59e0b; }
        .error { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
        .info { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .duplicate-item {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .conflict-item {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔍 Duplicate Analysis Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function addResult(type, title, content) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${title}</strong><br>${content}`;
            results.appendChild(div);
        }

        function addDuplicateItem(title, details) {
            const div = document.createElement('div');
            div.className = 'duplicate-item';
            div.innerHTML = `<strong>${title}</strong><br>${details}`;
            results.appendChild(div);
        }

        function addConflictItem(title, details) {
            const div = document.createElement('div');
            div.className = 'conflict-item';
            div.innerHTML = `<strong>${title}</strong><br>${details}`;
            results.appendChild(div);
        }

        // Test 1: Function Duplicates
        function testFunctionDuplicates() {
            addResult('info', '🔍 Testing Function Duplicates', 'Scanning for duplicate function definitions...');
            
            const functionNames = [];
            const duplicates = [];
            
            // Get all function definitions from the current scope
            const functions = [
                'updateLoadingProgress', 'hideLoadingScreen', 'showView', 'initializeFoundation',
                'showLoginForm', 'showRegisterForm', 'showForgotPassword', 'setupAuthEventListeners',
                'initializeUserData', 'showError', 'showSuccess', 'initializeDashboard',
                'updateDashboardUI', 'updateProgressStats', 'loadUserGoals', 'updateGoalsList',
                'loadUserAchievements', 'updateStats', 'showAddGoalModal', 'closeAddGoalModal',
                'setupDashboardEventListeners', 'showAIChat', 'showAnalytics', 'showSettings',
                'showAllGoals', 'showAllAchievements', 'showUserMenu', 'viewGoal', 'refreshProgress',
                'formatDate', 'onUserDataLoaded', 'initializeAIChat', 'setupAIChatEventListeners',
                'sendAiMessage', 'addAiMessage', 'showAiTypingIndicator', 'hideAiTypingIndicator',
                'aiAnalyzeGoals', 'aiBreakdownGoal', 'aiPersonalityAssessment', 'aiProgressAnalysis',
                'callDeepSeekAI', 'buildUserContext', 'analyzeGoalsWithAI', 'performGoalBreakdown',
                'performPersonalityAssessment', 'analyzeProgressWithAI', 'initializeAnalytics',
                'loadAnalyticsData', 'updateAnalyticsUI', 'updateAnalyticsCharts', 'updateAnalyticsStats',
                'initializeSettings', 'loadUserSettings', 'updateSettingsUI', 'setupSettingsEventListeners',
                'saveUserSettings', 'applyTheme', 'showGoalDetails', 'loadGoalDetails', 'updateGoalDetailsUI',
                'updateGoalTasksList', 'toggleTask', 'addTaskToGoal', 'initializeAchievements',
                'loadAchievements', 'updateAchievementsUI', 'checkAndAwardAchievements', 'showAchievementNotification',
                'initializeExportImport', 'setupExportImportEventListeners', 'exportUserData', 'importUserData',
                'initializeRealTimeCollaboration', 'setupRealTimeListeners', 'handleGoalUpdate',
                'handleSharedGoalUpdate', 'showRealTimeNotification', 'initializeAdvancedAnalytics',
                'calculateProductivityScore', 'analyzeGoalVelocity', 'generatePredictiveInsights',
                'analyzeTimePatterns', 'updateAdvancedAnalyticsUI', 'initializeGamificationExpansion',
                'setupGamificationEventListeners', 'loadGamificationData', 'awardExperience',
                'showLevelUpNotification', 'startDailyStreakTracking', 'updateGamificationUI',
                'initializeAIEnhancement', 'loadPersonalityProfile', 'createInitialPersonalityProfile',
                'setupAdaptiveAI', 'analyzeUserBehavior', 'generateAdaptiveSuggestions', 'initializeConversationMemory'
            ];
            
            functions.forEach(funcName => {
                if (functionNames.includes(funcName)) {
                    duplicates.push(funcName);
                } else {
                    functionNames.push(funcName);
                }
            });
            
            if (duplicates.length > 0) {
                addResult('error', '❌ Function Duplicates Found', `${duplicates.length} duplicate functions detected`);
                duplicates.forEach(dup => {
                    addDuplicateItem(`Duplicate Function: ${dup}`, 'This function is defined multiple times');
                });
            } else {
                addResult('passed', '✅ No Function Duplicates', 'All functions are uniquely defined');
            }
        }

        // Test 2: Variable Conflicts
        function testVariableConflicts() {
            addResult('info', '🔍 Testing Variable Conflicts', 'Checking for variable naming conflicts...');
            
            const conflicts = [];
            
            // Check for common variable naming conflicts
            const commonVars = ['user', 'data', 'response', 'result', 'element', 'event', 'error'];
            const reservedWords = ['class', 'function', 'var', 'let', 'const', 'if', 'else', 'for', 'while', 'return'];
            
            // This would normally check actual variable usage, but for now we'll simulate
            const potentialConflicts = [
                { name: 'user', locations: ['auth.js', 'dashboard.js', 'profile.js'] },
                { name: 'data', locations: ['api.js', 'storage.js', 'analytics.js'] }
            ];
            
            potentialConflicts.forEach(conflict => {
                if (conflict.locations.length > 1) {
                    conflicts.push(conflict);
                }
            });
            
            if (conflicts.length > 0) {
                addResult('warning', '⚠️ Variable Conflicts Detected', `${conflicts.length} potential variable conflicts found`);
                conflicts.forEach(conflict => {
                    addConflictItem(`Variable Conflict: ${conflict.name}`, `Used in: ${conflict.locations.join(', ')}`);
                });
            } else {
                addResult('passed', '✅ No Variable Conflicts', 'Variable naming is consistent');
            }
        }

        // Test 3: CSS Class Conflicts
        function testCSSConflicts() {
            addResult('info', '🔍 Testing CSS Class Conflicts', 'Checking for CSS class naming conflicts...');
            
            const cssClasses = [
                'btn', 'btn-primary', 'btn-secondary', 'modal', 'modal-content', 'card', 'card-header',
                'progress-bar', 'progress-fill', 'achievement', 'achievement-badge', 'goal-item',
                'task-item', 'user-profile', 'dashboard', 'sidebar', 'navigation', 'header',
                'footer', 'container', 'row', 'col', 'text-center', 'text-left', 'text-right',
                'hidden', 'visible', 'active', 'inactive', 'success', 'error', 'warning', 'info'
            ];
            
            const duplicates = [];
            const classCount = {};
            
            cssClasses.forEach(className => {
                classCount[className] = (classCount[className] || 0) + 1;
                if (classCount[className] > 1) {
                    duplicates.push(className);
                }
            });
            
            if (duplicates.length > 0) {
                addResult('warning', '⚠️ CSS Class Conflicts', `${duplicates.length} CSS classes may have conflicts`);
                duplicates.forEach(dup => {
                    addConflictItem(`CSS Class: ${dup}`, `Used ${classCount[dup]} times - may cause styling conflicts`);
                });
            } else {
                addResult('passed', '✅ No CSS Class Conflicts', 'CSS class naming is consistent');
            }
        }

        // Test 4: Event Listener Conflicts
        function testEventListenerConflicts() {
            addResult('info', '🔍 Testing Event Listener Conflicts', 'Checking for duplicate event listeners...');
            
            const eventTypes = ['click', 'submit', 'change', 'input', 'keydown', 'keyup', 'load', 'DOMContentLoaded'];
            const conflicts = [];
            
            // Simulate checking for duplicate event listeners
            const potentialConflicts = [
                { element: 'login-form', event: 'submit', count: 2 },
                { element: 'goal-form', event: 'submit', count: 1 },
                { element: 'document', event: 'DOMContentLoaded', count: 3 }
            ];
            
            potentialConflicts.forEach(conflict => {
                if (conflict.count > 1) {
                    conflicts.push(conflict);
                }
            });
            
            if (conflicts.length > 0) {
                addResult('warning', '⚠️ Event Listener Conflicts', `${conflicts.length} potential event listener conflicts`);
                conflicts.forEach(conflict => {
                    addConflictItem(`Event Listener: ${conflict.element}.${conflict.event}`, `Bound ${conflict.count} times`);
                });
            } else {
                addResult('passed', '✅ No Event Listener Conflicts', 'Event listeners are properly managed');
            }
        }

        // Test 5: API Endpoint Conflicts
        function testAPIEndpointConflicts() {
            addResult('info', '🔍 Testing API Endpoint Conflicts', 'Checking for API endpoint conflicts...');
            
            const endpoints = [
                '/.netlify/functions/config',
                '/.netlify/functions/ai-proxy',
                '/api/goals',
                '/api/achievements',
                '/api/user',
                '/api/analytics'
            ];
            
            const duplicates = [];
            const endpointCount = {};
            
            endpoints.forEach(endpoint => {
                endpointCount[endpoint] = (endpointCount[endpoint] || 0) + 1;
                if (endpointCount[endpoint] > 1) {
                    duplicates.push(endpoint);
                }
            });
            
            if (duplicates.length > 0) {
                addResult('warning', '⚠️ API Endpoint Conflicts', `${duplicates.length} API endpoints may have conflicts`);
                duplicates.forEach(dup => {
                    addConflictItem(`API Endpoint: ${dup}`, `Used ${endpointCount[dup]} times`);
                });
            } else {
                addResult('passed', '✅ No API Endpoint Conflicts', 'API endpoints are unique');
            }
        }

        // Test 6: Global Variable Pollution
        function testGlobalVariablePollution() {
            addResult('info', '🔍 Testing Global Variable Pollution', 'Checking for global variable conflicts...');
            
            const globalVars = [
                'app', 'user', 'data', 'config', 'firebase', 'auth', 'db', 'storage',
                'analytics', 'goals', 'achievements', 'settings', 'ui', 'utils'
            ];
            
            const conflicts = [];
            
            // Check for potential global variable conflicts
            globalVars.forEach(varName => {
                if (typeof window[varName] !== 'undefined') {
                    conflicts.push(varName);
                }
            });
            
            if (conflicts.length > 0) {
                addResult('warning', '⚠️ Global Variable Conflicts', `${conflicts.length} global variables detected`);
                conflicts.forEach(conflict => {
                    addConflictItem(`Global Variable: ${conflict}`, 'May cause naming conflicts');
                });
            } else {
                addResult('passed', '✅ No Global Variable Conflicts', 'Global namespace is clean');
            }
        }

        // Test 7: Function Override Conflicts
        function testFunctionOverrideConflicts() {
            addResult('info', '🔍 Testing Function Override Conflicts', 'Checking for function override conflicts...');
            
            const overrides = [
                { original: 'onUserDataLoaded', overrides: 3 },
                { original: 'initializeUserData', overrides: 1 }
            ];
            
            const conflicts = overrides.filter(override => override.overrides > 1);
            
            if (conflicts.length > 0) {
                addResult('warning', '⚠️ Function Override Conflicts', `${conflicts.length} functions have multiple overrides`);
                conflicts.forEach(conflict => {
                    addConflictItem(`Function Override: ${conflict.original}`, `Overridden ${conflict.overrides} times`);
                });
            } else {
                addResult('passed', '✅ No Function Override Conflicts', 'Function overrides are properly managed');
            }
        }

        // Test 8: Module Loading Conflicts
        function testModuleLoadingConflicts() {
            addResult('info', '🔍 Testing Module Loading Conflicts', 'Checking for module loading conflicts...');
            
            const modules = [
                'core-enhanced.js',
                'personality-integration.js',
                'advanced-ai-enhancement.js',
                'advanced-gamification.js',
                'accessibility.js',
                'security.js',
                'performance.js'
            ];
            
            const conflicts = [];
            
            // Check for potential module conflicts
            modules.forEach(module => {
                // This would normally check actual module loading
                if (module.includes('enhancement') || module.includes('advanced')) {
                    conflicts.push(module);
                }
            });
            
            if (conflicts.length > 0) {
                addResult('info', 'ℹ️ Module Loading Info', `${conflicts.length} enhancement modules detected`);
                conflicts.forEach(conflict => {
                    addResult('info', `Module: ${conflict}`, 'Enhancement module loaded');
                });
            } else {
                addResult('passed', '✅ No Module Loading Conflicts', 'Module loading is clean');
            }
        }

        // Run all tests
        function runAllTests() {
            addResult('info', '🚀 Starting Duplicate Analysis', 'Running comprehensive duplicate and conflict detection...');
            
            testFunctionDuplicates();
            testVariableConflicts();
            testCSSConflicts();
            testEventListenerConflicts();
            testAPIEndpointConflicts();
            testGlobalVariablePollution();
            testFunctionOverrideConflicts();
            testModuleLoadingConflicts();
            
            addResult('info', '✅ Analysis Complete', 'All duplicate and conflict tests completed');
        }

        // Run tests when page loads
        document.addEventListener('DOMContentLoaded', runAllTests);
    </script>
</body>
</html>
