<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Overlay Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .test-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .status {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Initializing Operator Uplift...</p>
    </div>
    
    <div class="test-controls">
        <h3>Loading Overlay Test</h3>
        <button class="btn" onclick="hideOverlay()">Hide Overlay</button>
        <button class="btn" onclick="removeOverlay()">Remove Overlay</button>
        <button class="btn" onclick="forceHide()">Force Hide</button>
        <button class="btn" onclick="checkStatus()">Check Status</button>
        <div class="status" id="status">Ready to test...</div>
    </div>
    
    <div style="padding: 20px; margin-top: 100px;">
        <h1>Dashboard Content</h1>
        <p>This content should be visible when the loading overlay is hidden.</p>
        <p>If you can see this, the overlay is working correctly.</p>
    </div>
    
    <script>
        function hideOverlay() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 500);
                updateStatus('Overlay hidden with fade effect');
            } else {
                updateStatus('Overlay not found');
            }
        }
        
        function removeOverlay() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.remove();
                updateStatus('Overlay completely removed from DOM');
            } else {
                updateStatus('Overlay not found');
            }
        }
        
        function forceHide() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.opacity = '0';
                overlay.style.visibility = 'hidden';
                overlay.style.display = 'none';
                overlay.style.pointerEvents = 'none';
                overlay.style.zIndex = '-1';
                updateStatus('Overlay force hidden with all methods');
            } else {
                updateStatus('Overlay not found');
            }
        }
        
        function checkStatus() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                const styles = window.getComputedStyle(overlay);
                updateStatus(`Overlay found - Display: ${styles.display}, Opacity: ${styles.opacity}, Visibility: ${styles.visibility}, Z-index: ${styles.zIndex}`);
            } else {
                updateStatus('Overlay not found in DOM');
            }
        }
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log('Status:', message);
        }
        
        // Auto-hide after 3 seconds
        setTimeout(() => {
            updateStatus('Auto-hiding overlay...');
            hideOverlay();
        }, 3000);
    </script>
</body>
</html>
