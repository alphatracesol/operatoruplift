<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Matrix Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .test-content {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 12px;
            position: relative;
            z-index: 10;
        }
        
        /* Matrix Rain Background */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            display: block;
            background: transparent;
        }
        
        .matrix-column {
            position: absolute;
            top: -100vh;
            color: #f97316;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 8px #f97316, 0 0 16px #f97316;
            animation: matrix-fall linear infinite;
            opacity: 0.9;
            white-space: nowrap;
            line-height: 1.2;
        }
        
        @keyframes matrix-fall {
            0% {
                transform: translateY(-100vh);
                opacity: 0.9;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        
        button {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <!-- Matrix Rain Background -->
    <div id="matrixRain" class="matrix-rain"></div>
    
    <div class="test-content">
        <h1>Simple Matrix Rain Test</h1>
        <p>You should see orange falling characters in the background.</p>
        
        <button onclick="testMatrix()">Test Matrix Rain</button>
        <button onclick="showContainer()">Show Container</button>
        
        <div id="status" style="margin-top: 20px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 6px;">
            <strong>Status:</strong> <span id="statusText">Ready</span>
        </div>
    </div>

    <script>
        function testMatrix() {
            const matrixContainer = document.getElementById('matrixRain');
            if (!matrixContainer) {
                document.getElementById('statusText').textContent = 'Error: Container not found';
                return;
            }
            
            document.getElementById('statusText').textContent = 'Creating matrix rain...';
            
            // Clear existing columns
            matrixContainer.innerHTML = '';
            
            // Add red background to see container
            matrixContainer.style.background = 'rgba(255, 0, 0, 0.1)';
            
            const columns = Math.floor(window.innerWidth / 25);
            const characters = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            
            for (let i = 0; i < columns; i++) {
                const column = document.createElement('div');
                column.className = 'matrix-column';
                column.style.left = (i * 25) + 'px';
                column.style.animationDuration = (Math.random() * 4 + 3) + 's';
                column.style.animationDelay = Math.random() * 3 + 's';
                
                let columnText = '';
                const columnLength = Math.floor(Math.random() * 15) + 8;
                for (let j = 0; j < columnLength; j++) {
                    columnText += characters[Math.floor(Math.random() * characters.length)];
                }
                column.textContent = columnText;
                
                matrixContainer.appendChild(column);
            }
            
            document.getElementById('statusText').textContent = `Created ${columns} columns`;
            
            // Remove red background after 3 seconds
            setTimeout(() => {
                matrixContainer.style.background = 'transparent';
            }, 3000);
        }
        
        function showContainer() {
            const matrixRain = document.getElementById('matrixRain');
            if (matrixRain) {
                matrixRain.style.background = 'rgba(255, 0, 0, 0.3)';
                document.getElementById('statusText').textContent = 'Container visible (red background)';
                setTimeout(() => {
                    matrixRain.style.background = 'transparent';
                    document.getElementById('statusText').textContent = 'Container hidden';
                }, 2000);
            }
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('statusText').textContent = 'Page loaded - click Test Matrix Rain';
        });
    </script>
</body>
</html>
